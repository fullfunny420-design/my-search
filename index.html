<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySearch</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
}

body.dark {
    background: #202124;
    color: #e8eaed;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 64px;
    width: 100%;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: #fff;
    border-bottom: 1px solid #e5e5e5;

    position: sticky;
    top: 0;
    z-index: 5000;
}

body.dark .topbar {
    background: #202124;
    border-color: #3c4043;
}

/* LEFT */

.top-left {
    display: flex;
    align-items: center;
    gap: 4px;

    min-width: 230px;
}

.nav-btn {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 50%;

    background: transparent;
    color: #5f6368;

    font-size: 22px;

    cursor: pointer;
}

.nav-btn:hover {
    background: #f1f3f4;
}

body.dark .nav-btn {
    color: #bdc1c6;
}

body.dark .nav-btn:hover {
    background: #303134;
}

/* LOGO */

.logo {
    margin-left: 8px;

    font-size: 25px;
    font-weight: bold;

    letter-spacing: -1.5px;

    cursor: pointer;
    white-space: nowrap;
}

.logo .b {
    color: #4285f4;
}

.logo .r {
    color: #ea4335;
}

.logo .y {
    color: #fbbc05;
}

.logo .g {
    color: #34a853;
}

/* =========================================================
   TOP SEARCH
========================================================= */

.top-search-area {
    flex: 1;

    display: flex;
    justify-content: flex-start;

    padding: 0 25px;
}

.top-search {
    width: min(680px, 100%);
    height: 46px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 25px;
}

body.dark .top-search {
    background: #303134;
    border-color: #5f6368;
}

.top-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.2);
}

.top-search-icon {
    margin-right: 10px;
    color: #70757a;
    font-size: 18px;
}

.top-search input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font-size: 16px;
}

.top-search-clear {
    display: none;

    border: 0;
    background: transparent;

    color: #70757a;

    font-size: 20px;

    cursor: pointer;
}

/* =========================================================
   TOP RIGHT
========================================================= */

.top-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.top-link {
    border: 0;
    background: transparent;

    color: #5f6368;

    cursor: pointer;

    font-size: 14px;

    padding: 8px 10px;
}

.top-link:hover {
    background: #f1f3f4;
    border-radius: 5px;
}

body.dark .top-link {
    color: #bdc1c6;
}

body.dark .top-link:hover {
    background: #303134;
}

/* =========================================================
   HOME
========================================================= */

.home {
    min-height: calc(100vh - 64px);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 120px;
}

.home-logo {
    font-size: 72px;
    font-weight: bold;

    letter-spacing: -5px;

    margin-bottom: 35px;

    user-select: none;
}

.home-logo .b {
    color: #4285f4;
}

.home-logo .r {
    color: #ea4335;
}

.home-logo .y {
    color: #fbbc05;
}

.home-logo .g {
    color: #34a853;
}

/* =========================================================
   HOME SEARCH
========================================================= */

.home-search-area {
    width: min(650px, 92vw);

    position: relative;
}

.home-search {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    border: 1px solid #dfe1e5;
    border-radius: 28px;

    background: #fff;
}

.home-search:hover,
.home-search:focus-within {
    box-shadow: 0 1px 8px rgba(32,33,36,.18);
}

body.dark .home-search {
    background: #303134;
    border-color: #5f6368;
}

.home-search-icon {
    color: #70757a;

    font-size: 20px;

    margin-right: 12px;
}

.home-search input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font-size: 17px;
}

.home-clear {
    display: none;

    border: 0;
    background: transparent;

    color: #70757a;

    font-size: 21px;

    cursor: pointer;

    margin-right: 5px;
}

/* =========================================================
   HISTORY
========================================================= */

.history-box {
    display: none;

    width: min(650px, 94vw);

    margin-top: 10px;

    background: #fff;

    border: 1px solid #dadce0;

    border-radius: 12px;

    box-shadow: 0 4px 12px rgba(0,0,0,.12);

    overflow: hidden;

    position: relative;

    z-index: 100;
}

body.dark .history-box {
    background: #303134;
    border-color: #5f6368;
}

.history-title {
    padding: 13px 16px;

    font-size: 13px;
    font-weight: bold;

    color: #5f6368;

    border-bottom: 1px solid #eee;
}

body.dark .history-title {
    color: #bdc1c6;
    border-color: #3c4043;
}

.history-item {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 12px 16px;

    cursor: pointer;

    font-size: 15px;
}

.history-item:hover {
    background: #f8f9fa;
}

body.dark .history-item:hover {
    background: #3c4043;
}

.history-clock {
    color: #70757a;
}

.history-text {
    flex: 1;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-delete {
    border: 0;
    background: transparent;

    color: #70757a;

    cursor: pointer;

    font-size: 16px;
}

.history-delete:hover {
    color: #202124;
}

body.dark .history-delete:hover {
    color: #fff;
}

.history-footer {
    padding: 10px 16px;

    border-top: 1px solid #eee;

    text-align: right;
}

body.dark .history-footer {
    border-color: #3c4043;
}

.clear-history {
    border: 0;
    background: transparent;

    color: #4285f4;

    cursor: pointer;

    font-size: 13px;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    display: none;

    width: min(650px, 94vw);

    margin-top: 6px;

    background: #fff;

    border: 1px solid #dadce0;

    border-radius: 12px;

    overflow: hidden;

    box-shadow: 0 4px 12px rgba(0,0,0,.12);

    position: absolute;

    top: 57px;
    left: 0;

    z-index: 200;
}

body.dark .suggestions {
    background: #303134;
    border-color: #5f6368;
}

.suggestion-item {
    padding: 11px 16px;

    cursor: pointer;

    font-size: 15px;
}

.suggestion-item:hover {
    background: #f8f9fa;
}

body.dark .suggestion-item:hover {
    background: #3c4043;
}

/* =========================================================
   HOME BUTTONS
========================================================= */

.home-buttons {
    display: flex;

    gap: 12px;

    margin-top: 28px;
}

.home-btn {
    border: 1px solid transparent;

    background: #f8f9fa;

    color: #202124;

    border-radius: 5px;

    padding: 10px 18px;

    font-size: 14px;

    cursor: pointer;
}

.home-btn:hover {
    border-color: #dadce0;

    box-shadow: 0 1px 1px rgba(0,0,0,.1);
}

body.dark .home-btn {
    background: #303134;
    color: #e8eaed;
}

body.dark .home-btn:hover {
    border-color: #5f6368;
}

/* =========================================================
   SEARCH PAGE
========================================================= */

.search-page {
    display: none;

    padding: 20px 0 60px 0;
}

.search-container {
    width: min(1100px, 94vw);

    margin: 0 auto;
}

/* =========================================================
   SEARCH HEADER
========================================================= */

.search-header {
    display: flex;
    align-items: center;

    gap: 20px;

    margin-bottom: 15px;
}

.search-header-title {
    font-size: 14px;

    color: #70757a;
}

body.dark .search-header-title {
    color: #9aa0a6;
}

/* =========================================================
   TABS
========================================================= */

.tabs {
    display: flex;

    gap: 8px;

    border-bottom: 1px solid #dadce0;

    margin-bottom: 25px;
}

body.dark .tabs {
    border-color: #3c4043;
}

.tab {
    border: 0;

    background: transparent;

    padding: 12px 16px;

    cursor: pointer;

    color: #5f6368;

    font-size: 14px;

    border-bottom: 3px solid transparent;
}

.tab:hover {
    color: #202124;
}

.tab.active {
    color: #1a73e8;

    border-bottom-color: #1a73e8;
}

body.dark .tab {
    color: #bdc1c6;
}

body.dark .tab:hover {
    color: #fff;
}

body.dark .tab.active {
    color: #8ab4f8;
    border-bottom-color: #8ab4f8;
}

/* =========================================================
   RESULT LAYOUT
========================================================= */

.results-layout {
    display: flex;

    align-items: flex-start;

    gap: 35px;
}

.results-main {
    flex: 1;

    min-width: 0;
}

.info-panel {
    width: 300px;

    border: 1px solid #dadce0;

    border-radius: 10px;

    padding: 18px;

    position: sticky;

    top: 85px;
}

body.dark .info-panel {
    border-color: #3c4043;
}

.info-title {
    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}

.info-text {
    color: #5f6368;

    font-size: 14px;

    line-height: 1.5;
}

body.dark .info-text {
    color: #bdc1c6;
}

/* =========================================================
   WEB RESULTS
========================================================= */

.result {
    margin-bottom: 30px;
}

.result-url {
    color: #188038;

    font-size: 13px;

    margin-bottom: 4px;

    word-break: break-all;
}

body.dark .result-url {
    color: #81c995;
}

.result-title {
    color: #1a0dab;

    font-size: 20px;

    margin-bottom: 5px;

    cursor: pointer;

    text-decoration: none;
}

.result-title:hover {
    text-decoration: underline;
}

body.dark .result-title {
    color: #8ab4f8;
}

.result-snippet {
    color: #4d5156;

    font-size: 14px;

    line-height: 1.55;
}

body.dark .result-snippet {
    color: #bdc1c6;
}

.no-results {
    padding: 40px 0;

    color: #70757a;

    font-size: 16px;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    padding: 35px 0;

    text-align: left;

    color: #70757a;

    font-size: 15px;
}

/* =========================================================
   IMAGE GRID
========================================================= */

.image-grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 14px;
}

.image-card {
    border-radius: 10px;

    overflow: hidden;

    background: #f8f9fa;

    cursor: pointer;

    aspect-ratio: 1 / 1;

    position: relative;
}

body.dark .image-card {
    background: #303134;
}

.image-card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    transition: transform .2s ease;
}

.image-card:hover img {
    transform: scale(1.04);
}

.image-caption {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 10px;

    background: linear-gradient(
        transparent,
        rgba(0,0,0,.7)
    );

    color: #fff;

    font-size: 12px;
}

/* =========================================================
   NEWS
========================================================= */

.news-item {
    padding: 18px 0;

    border-bottom: 1px solid #eee;
}

body.dark .news-item {
    border-color: #3c4043;
}

.news-title {
    font-size: 18px;

    color: #1a0dab;

    cursor: pointer;

    margin-bottom: 5px;
}

body.dark .news-title {
    color: #8ab4f8;
}

.news-source {
    font-size: 12px;

    color: #70757a;

    margin-bottom: 7px;
}

.news-snippet {
    color: #4d5156;

    font-size: 14px;

    line-height: 1.5;
}

body.dark .news-snippet {
    color: #bdc1c6;
}

/* =========================================================
   VIDEOS
========================================================= */

.video-item {
    display: flex;

    gap: 16px;

    padding: 15px 0;

    border-bottom: 1px solid #eee;

    cursor: pointer;
}

body.dark .video-item {
    border-color: #3c4043;
}

.video-thumb {
    width: 190px;

    height: 110px;

    border-radius: 8px;

    object-fit: cover;

    background: #eee;
}

.video-content {
    flex: 1;
}

.video-title {
    font-size: 18px;

    color: #1a0dab;

    margin-bottom: 7px;
}

body.dark .video-title {
    color: #8ab4f8;
}

.video-description {
    color: #5f6368;

    font-size: 14px;

    line-height: 1.5;
}

body.dark .video-description {
    color: #bdc1c6;
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination {
    display: flex;

    justify-content: center;

    gap: 8px;

    margin-top: 40px;
}

.page-btn {
    min-width: 38px;
    height: 38px;

    border: 1px solid #dadce0;

    background: #fff;

    color: #3c4043;

    border-radius: 5px;

    cursor: pointer;
}

.page-btn:hover {
    background: #f8f9fa;
}

.page-btn.active {
    background: #1a73e8;

    border-color: #1a73e8;

    color: #fff;
}

body.dark .page-btn {
    background: #303134;

    border-color: #5f6368;

    color: #e8eaed;
}

body.dark .page-btn:hover {
    background: #3c4043;
}

body.dark .page-btn.active {
    background: #8ab4f8;

    border-color: #8ab4f8;

    color: #202124;
}

/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.88);

    z-index: 10000;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.lightbox.show {
    display: flex;
}

.lightbox-close {
    position: absolute;

    top: 20px;
    right: 25px;

    width: 44px;
    height: 44px;

    border: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.15);

    color: #fff;

    font-size: 25px;

    cursor: pointer;

    z-index: 100;
}

.lightbox-close:hover {
    background: rgba(255,255,255,.25);
}

.lightbox-content {
    width: min(1100px, 92vw);
    height: min(90vh, 800px);

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;
}

.lightbox-main {
    width: 75%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    position: relative;
}

.lightbox-main img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    transform-origin: center center;

    cursor: grab;

    user-select: none;

    transition: transform .15s ease;
}

.lightbox-main img:active {
    cursor: grabbing;
}

/* =========================================================
   RELATED IMAGES
========================================================= */

.related-panel {
    width: 25%;
    height: 100%;

    padding-left: 15px;

    overflow-y: auto;
}

.related-title {
    color: #fff;

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 12px;
}

.related-grid {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 8px;
}

.related-item {
    width: 100%;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    border-radius: 6px;

    cursor: pointer;
}

.related-item img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.related-item:hover img {
    opacity: .8;
}

/* =========================================================
   ZOOM CONTROLS
========================================================= */

.zoom-controls {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 100;
}

.zoom-btn {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.18);

    color: #fff;

    font-size: 22px;

    cursor: pointer;
}

.zoom-btn:hover {
    background: rgba(255,255,255,.3);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .results-layout {
        display: block;
    }

    .info-panel {
        width: 100%;

        position: static;

        margin-top: 30px;
    }

    .image-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .lightbox-content {
        width: 95vw;
    }

    .lightbox-main {
        width: 70%;
    }

    .related-panel {
        width: 30%;
    }

}

@media (max-width: 650px) {

    .top-left {
        min-width: auto;
    }

    .topbar {
        padding: 0 8px;
    }

    .top-link {
        display: none;
    }

    .top-search-area {
        padding: 0 8px;
    }

    .home {
        padding-top: 80px;
    }

    .home-logo {
        font-size: 55px;
    }

    .image-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .video-item {
        display: block;
    }

    .video-thumb {
        width: 100%;
        height: 180px;
        margin-bottom: 10px;
    }

    .lightbox-content {
        width: 100vw;
        height: 100vh;
    }

    .lightbox-main {
        width: 100%;
        height: 75%;
    }

    .related-panel {
        position: absolute;

        bottom: 0;
        left: 0;

        width: 100%;
        height: 25%;

        padding: 8px 12px;

        background: rgba(0,0,0,.5);
    }

    .related-grid {
        grid-template-columns: repeat(5, 1fr);
    }

}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

    <div class="top-left">

        <button
            class="nav-btn"
            id="backBtn"
            title="Back"
        >
            ←
        </button>

        <button
            class="nav-btn"
            id="reloadBtn"
            title="Reload"
        >
            ↻
        </button>

        <div
            class="logo"
            id="topLogo"
        >
            <span class="b">M</span><span class="r">y</span><span class="y">S</span><span class="g">earch</span>
        </div>

    </div>

    <div class="top-search-area">

        <div class="top-search">

            <span class="top-search-icon">
                🔍
            </span>

            <input
                type="text"
                id="topSearchInp"
                placeholder="Search"
                autocomplete="off"
            >

            <button
                class="top-search-clear"
                id="topClear"
            >
                ×
            </button>

        </div>

    </div>

    <div class="top-right">

        <button
            class="top-link"
            id="aboutBtn"
        >
            About
        </button>

        <button
            class="top-link"
            id="darkBtn"
        >
            Dark
        </button>

    </div>

</header>


<!-- =======================================================
     HOME
======================================================= -->

<main class="home" id="home">

    <div class="home-logo">
        <span class="b">M</span><span class="r">y</span><span class="y">S</span><span class="g">earch</span>
    </div>

    <div class="home-search-area">

        <div class="home-search">

            <span class="home-search-icon">
                🔍
            </span>

            <input
                type="text"
                id="homeSearch"
                placeholder="Search the web"
                autocomplete="off"
            >

            <button
                class="home-clear"
                id="homeClear"
            >
                ×
            </button>

        </div>

        <!-- SUGGESTIONS -->

        <div
            class="suggestions"
            id="suggestions"
        ></div>

        <!-- RECENT SEARCHES -->

        <div
            class="history-box"
            id="historyBox"
        >

            <div class="history-title">
                Recent searches
            </div>

            <div id="historyList"></div>

            <div class="history-footer">

                <button
                    class="clear-history"
                    id="clearHistoryBtn"
                >
                    Clear search history
                </button>

            </div>

        </div>

    </div>


    <div class="home-buttons">

        <button
            class="home-btn"
            id="searchBtn"
        >
            MySearch
        </button>

        <button
            class="home-btn"
            id="luckyBtn"
        >
            Surprise me
        </button>

    </div>

</main>


<!-- =======================================================
     SEARCH PAGE
======================================================= -->

<section
    class="search-page"
    id="searchPage"
>

    <div class="search-container">

        <div class="search-header">

            <div
                class="search-header-title"
                id="searchHeaderTitle"
            ></div>

        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                data-tab="all"
            >
                All
            </button>

            <button
                class="tab"
                data-tab="images"
            >
                Images
            </button>

            <button
                class="tab"
                data-tab="news"
            >
                News
            </button>

            <button
                class="tab"
                data-tab="videos"
            >
                Videos
            </button>

        </div>


        <!-- RESULTS -->

        <div class="results-layout">

            <div
                class="results-main"
                id="resultsMain"
            ></div>

            <aside class="info-panel">

                <div class="info-title">
                    MySearch
                </div>

                <div class="info-text">
                    Search results are collected from
                    available web sources.
                </div>

            </aside>

        </div>


        <div
            class="pagination"
            id="pagination"
        ></div>

    </div>

</section>


<!-- =======================================================
     IMAGE LIGHTBOX
======================================================= -->

<div
    class="lightbox"
    id="lightbox"
>

    <button
        class="lightbox-close"
        id="lightboxClose"
    >
        ×
    </button>


    <div class="lightbox-content">

        <div class="lightbox-main">

            <img
                id="lightboxImage"
                src=""
                alt=""
            >

            <div class="zoom-controls">

                <button
                    class="zoom-btn"
                    id="zoomOutBtn"
                >
                    −
                </button>

                <button
                    class="zoom-btn"
                    id="zoomResetBtn"
                >
                    1×
                </button>

                <button
                    class="zoom-btn"
                    id="zoomInBtn"
                >
                    +
                </button>

            </div>

        </div>


        <div class="related-panel">

            <div class="related-title">
                Related images
            </div>

            <div
                class="related-grid"
                id="relatedGrid"
            ></div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   VARIABLES
========================================================= */

const home = document.getElementById("home");

const searchPage =
    document.getElementById("searchPage");

const homeSearch =
    document.getElementById("homeSearch");

const topSearchInp =
    document.getElementById("topSearchInp");

const homeClear =
    document.getElementById("homeClear");

const topClear =
    document.getElementById("topClear");

const historyBox =
    document.getElementById("historyBox");

const historyList =
    document.getElementById("historyList");

const suggestions =
    document.getElementById("suggestions");

const resultsMain =
    document.getElementById("resultsMain");

const pagination =
    document.getElementById("pagination");

const searchHeaderTitle =
    document.getElementById("searchHeaderTitle");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const relatedGrid =
    document.getElementById("relatedGrid");

const backBtn =
    document.getElementById("backBtn");

const reloadBtn =
    document.getElementById("reloadBtn");

const topLogo =
    document.getElementById("topLogo");

const aboutBtn =
    document.getElementById("aboutBtn");

const darkBtn =
    document.getElementById("darkBtn");

const searchBtn =
    document.getElementById("searchBtn");

const luckyBtn =
    document.getElementById("luckyBtn");

const clearHistoryBtn =
    document.getElementById("clearHistoryBtn");

const lightboxClose =
    document.getElementById("lightboxClose");

const zoomInBtn =
    document.getElementById("zoomInBtn");

const zoomOutBtn =
    document.getElementById("zoomOutBtn");

const zoomResetBtn =
    document.getElementById("zoomResetBtn");


let currentQuery = "";

let currentPage = 1;

let currentTab = "all";

let imageItems = [];

let currentImageIndex = 0;

let zoomLevel = 1;

let dragStartX = 0;

let dragStartY = 0;

let imageOffsetX = 0;

let imageOffsetY = 0;

let dragging = false;


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "mysearch-history"
            )
        ) || [];

    } catch {

        return [];

    }

}


function saveHistory(query) {

    query = query.trim();

    if (!query) {
        return;
    }

    let history = getHistory();

    history =
        history.filter(
            item =>
                item.toLowerCase() !==
                query.toLowerCase()
        );

    history.unshift(query);

    history =
        history.slice(0, 10);

    localStorage.setItem(
        "mysearch-history",
        JSON.stringify(history)
    );

    renderHistory();

}


function renderHistory() {

    const history =
        getHistory();

    historyList.innerHTML = "";

    if (!history.length) {

        historyBox.style.display =
            "none";

        return;

    }

    history.forEach(
        query => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.innerHTML = `
                <span class="history-clock">
                    🕘
                </span>

                <span class="history-text">
                    ${escapeHtml(query)}
                </span>

                <button
                    class="history-delete"
                    title="Remove"
                >
                    ×
                </button>
            `;

            item.addEventListener(
                "click",
                event => {

                    if (
                        event.target.classList.contains(
                            "history-delete"
                        )
                    ) {
                        return;
                    }

                    homeSearch.value =
                        query;

                    historyBox.style.display =
                        "none";

                    suggestions.style.display =
                        "none";

                    performSearch();

                }
            );


            const deleteBtn =
                item.querySelector(
                    ".history-delete"
                );

            deleteBtn.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    removeHistory(query);

                }
            );


            historyList.appendChild(
                item
            );

        }
    );

}


function removeHistory(query) {

    let history =
        getHistory();

    history =
        history.filter(
            item => item !== query
        );

    localStorage.setItem(
        "mysearch-history",
        JSON.stringify(history)
    );

    renderHistory();

    historyBox.style.display =
        history.length
            ? "block"
            : "none";

}


function clearHistory() {

    localStorage.removeItem(
        "mysearch-history"
    );

    historyList.innerHTML = "";

    historyBox.style.display =
        "none";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}


/* =========================================================
   SUGGESTIONS
========================================================= */

function renderSuggestions() {

    const value =
        homeSearch.value.trim();

    if (!value) {

        suggestions.style.display =
            "none";

        return;

    }

    const history =
        getHistory();

    const matches =
        history.filter(
            item =>
                item
                    .toLowerCase()
                    .includes(
                        value.toLowerCase()
                    )
        );


    if (!matches.length) {

        suggestions.style.display =
            "none";

        return;

    }


    suggestions.innerHTML = "";


    matches.forEach(
        query => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "suggestion-item";

            item.textContent =
                query;

            item.addEventListener(
                "click",
                () => {

                    homeSearch.value =
                        query;

                    suggestions.style.display =
                        "none";

                    historyBox.style.display =
                        "none";

                    performSearch();

                }
            );

            suggestions.appendChild(
                item
            );

        }
    );


    suggestions.style.display =
        "block";

}


/* =========================================================
   HOME INPUT
========================================================= */

homeSearch.addEventListener(
    "focus",
    () => {

        const history =
            getHistory();

        /*
           IMPORTANT:
           Recent Searches only appears
           after clicking/focusing the box.
        */

        if (!history.length) {

            historyBox.style.display =
                "none";

            return;

        }

        renderHistory();

        historyBox.style.display =
            "block";

    }
);


/*
   When clicking anywhere outside
   the home search area, hide history.
*/

document.addEventListener(
    "click",
    event => {

        const homeSearchArea =
            document.querySelector(
                ".home-search-area"
            );

        if (
            homeSearchArea &&
            !homeSearchArea.contains(
                event.target
            )
        ) {

            historyBox.style.display =
                "none";

            suggestions.style.display =
                "none";

        }

    }
);


homeSearch.addEventListener(
    "input",
    () => {

        homeClear.style.display =
            homeSearch.value
                ? "block"
                : "none";

        renderSuggestions();

    }
);


homeSearch.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            suggestions.style.display =
                "none";

            historyBox.style.display =
                "none";

            performSearch();

        }

    }
);


/* =========================================================
   TOP INPUT
========================================================= */

topSearchInp.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            homeSearch.value =
                topSearchInp.value;

            performSearch();

        }

    }
);


topSearchInp.addEventListener(
    "input",
    () => {

        topClear.style.display =
            topSearchInp.value
                ? "block"
                : "none";

    }
);


topClear.addEventListener(
    "click",
    () => {

        topSearchInp.value = "";

        topClear.style.display =
            "none";

        topSearchInp.focus();

    }
);


homeClear.addEventListener(
    "click",
    () => {

        homeSearch.value = "";

        homeClear.style.display =
            "none";

        suggestions.style.display =
            "none";

        homeSearch.focus();

    }
);


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(
    page = 1
) {

    const query =
        homeSearch.value.trim();

    if (!query) {
        return;
    }

    currentQuery =
        query;

    currentPage =
        page;

    saveHistory(query);

    historyBox.style.display =
        "none";

    suggestions.style.display =
        "none";

    topSearchInp.value =
        query;

    topClear.style.display =
        "block";

    home.style.display =
        "none";

    searchPage.style.display =
        "block";

    searchHeaderTitle.textContent =
        `Results for "${query}"`;

    currentTab =
        "all";

    setActiveTab(
        "all"
    );

    await loadResults();

}


/* =========================================================
   LOAD RESULTS
========================================================= */

async function loadResults() {

    resultsMain.innerHTML = `
        <div class="loading">
            Searching...
        </div>
    `;

    pagination.innerHTML =
        "";


    if (
        currentTab ===
        "images"
    ) {

        await loadImages();

        return;

    }


    if (
        currentTab ===
        "news"
    ) {

        await loadNews();

        return;

    }


    if (
        currentTab ===
        "videos"
    ) {

        await loadVideos();

        return;

    }


    await loadWebResults();

}


/* =========================================================
   WEB RESULTS
========================================================= */

async function loadWebResults() {

    try {

        const response =
            await fetch(
                `/api/search?q=${encodeURIComponent(
                    currentQuery
                )}&page=${currentPage}`
            );


        if (!response.ok) {
            throw new Error(
                "Search request failed"
            );
        }


        const data =
            await response.json();


        const results =
            data.results ||
            data.items ||
            [];


        resultsMain.innerHTML =
            "";


        if (!results.length) {

            resultsMain.innerHTML = `
                <div class="no-results">
                    No results found.
                </div>
            `;

            return;

        }


        results.forEach(
            item => {

                const result =
                    document.createElement(
                        "div"
                    );

                result.className =
                    "result";


                const url =
                    item.url ||
                    item.link ||
                    "";


                const title =
                    item.title ||
                    item.name ||
                    url;


                const snippet =
                    item.description ||
                    item.snippet ||
                    item.text ||
                    "";


                result.innerHTML = `
                    <div class="result-url">
                        ${escapeHtml(url)}
                    </div>

                    <a
                        class="result-title"
                        href="${escapeHtml(url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHtml(title)}
                    </a>

                    <div class="result-snippet">
                        ${escapeHtml(snippet)}
                    </div>
                `;


                resultsMain.appendChild(
                    result
                );

            }
        );


        renderPagination(
            data.totalPages ||
            data.pages ||
            5
        );


    } catch (error) {

        console.error(
            error
        );

        resultsMain.innerHTML = `
            <div class="no-results">
                Search failed. Make sure the server is running.
            </div>
        `;

    }

}


/* =========================================================
   IMAGES
========================================================= */

async function loadImages() {

    resultsMain.innerHTML = `
        <div class="loading">
            Loading images...
        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/images?q=${encodeURIComponent(
                    currentQuery
                )}&page=${currentPage}`
            );


        if (!response.ok) {
            throw new Error(
                "Image request failed"
            );
        }


        const data =
            await response.json();


        const items =
            data.results ||
            data.items ||
            data.images ||
            [];


        imageItems =
            items;


        resultsMain.innerHTML = "";


        if (!items.length) {

            resultsMain.innerHTML = `
                <div class="no-results">
                    No images found.
                </div>
            `;

            return;

        }


        const grid =
            document.createElement(
                "div"
            );

        grid.className =
            "image-grid";


        items.forEach(
            (item, index) => {

                const imageUrl =
                    item.image ||
                    item.thumbnail ||
                    item.url ||
                    item.src ||
                    "";


                if (!imageUrl) {
                    return;
                }


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "image-card";


                const img =
                    document.createElement(
                        "img"
                    );

                img.src =
                    imageUrl;

                img.alt =
                    item.title ||
                    currentQuery;

                img.loading =
                    "lazy";


                card.appendChild(
                    img
                );


                if (
                    item.title ||
                    item.name
                ) {

                    const caption =
                        document.createElement(
                            "div"
                        );

                    caption.className =
                        "image-caption";

                    caption.textContent =
                        item.title ||
                        item.name;

                    card.appendChild(
                        caption
                    );

                }


                card.addEventListener(
                    "click",
                    () => {

                        openLightbox(
                            index
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );


        resultsMain.appendChild(
            grid
        );


        renderPagination(
            data.totalPages ||
            data.pages ||
            5
        );


    } catch (error) {

        console.error(
            error
        );

        resultsMain.innerHTML = `
            <div class="no-results">
                Image search failed.
            </div>
        `;

    }

}


/* =========================================================
   NEWS
========================================================= */

        <div class="loading">

        </div>
    `;

                `/api/search?q=${encodeURIComponent(

                )}&page=${currentPage}`
            );

        }

                    <div class="news-source">

        );


    } catch (error) {

        );

        resultsMain.innerHTML = `

        `;

}


/* =========================================================
   VIDEOS
========================================================= */

async function loadVideos() {

    resultsMain.innerHTML = `
        <div class="loading">
            Loading videos...
        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/search?q=${encodeURIComponent(
                    currentQuery
                )}&page=${currentPage}`
            );


        const data =
            await response.json();


        const results =
            data.results ||
            data.items ||
            [];


        resultsMain.innerHTML =

                <div class="no-results">

                </div>
            `;

        }


        results.forEach(

                const video =

                        "div"
                    );

                video.className =

                    item.image ||
                    "";


                video.innerHTML = `
                    ${
                        thumbnail
                            ? `
                                <img
                                    class="video-thumb"
                                    src="${escapeHtml(
                                        thumbnail
                                    )}"
                                    alt=""
                                >
                              `
                            : ""
                    }

                    <div class="video-content">

                        <div class="video-title">
                            ${escapeHtml(
                                item.title ||
                                item.name ||
                                ""
                            )}
                        </div>

                            ${escapeHtml(
                                item.description ||

                            )}

                    </div>
                `;

                );

        );


    } catch (error) {

        );

            <div class="no-results">
                Video search failed.
            </div>
        `;

    }

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(
    totalPages
) {

    pagination.innerHTML =
        "";


    if (
        !totalPages ||
        totalPages <= 1
    ) {
        return;
    }


    const maxPages =
        Math.min(
            Number(totalPages),
            10
        );


    for (
        let i = 1;
        i <= maxPages;
        i++
    ) {

        const btn =
            document.createElement(
                "button"
            );

        btn.className =
            "page-btn";


        if (
            i === currentPage
        ) {

            btn.classList.add(
                "active"
            );

        }


        btn.textContent =
            i;


        btn.addEventListener(
            "click",
            () => {

                currentPage =
                    i;

                loadResults();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );


        pagination.appendChild(
            btn
        );

    }

}


/* =========================================================
   TABS
========================================================= */

document.querySelectorAll(
    ".tab"
).forEach(
    tab => {

        tab.addEventListener(
            "click",
            () => {

                const type =
                    tab.dataset.tab;

                currentTab =
                    type;

                currentPage =
                    1;

                setActiveTab(
                    type
                );

                loadResults();

            }
        );

    }
);


function setActiveTab(
    type
) {

    document.querySelectorAll(
        ".tab"
    ).forEach(
        tab => {

            tab.classList.toggle(
                "active",
                tab.dataset.tab ===
                type
            );

        }
    );

}


/* =========================================================
   IMAGE LIGHTBOX
========================================================= */

function openLightbox(
    index
) {

    if (
        !imageItems.length
    ) {
        return;
    }


    currentImageIndex =
        index;


    zoomLevel =
        1;

    imageOffsetX =
        0;

    imageOffsetY =
        0;


    updateLightboxImage();

    renderRelatedImages();


    lightbox.classList.add(
        "show"
    );

}


function closeLightbox() {

    lightbox.classList.remove(
        "show"
    );

}


function updateLightboxImage() {

    const item =
        imageItems[
            currentImageIndex
        ];


    if (!item) {
        return;
    }


    const imageUrl =
        item.image ||
        item.original ||
        item.thumbnail ||
        item.url ||
        item.src ||
        "";


    lightboxImage.src =
        imageUrl;


    lightboxImage.alt =
        item.title ||
        currentQuery;


    updateZoom();

}


function renderRelatedImages() {

    relatedGrid.innerHTML =
        "";


    imageItems.forEach(
        (item, index) => {

            if (
                index ===
                currentImageIndex
            ) {
                return;
            }


            const imageUrl =
                item.image ||
                item.thumbnail ||
                item.original ||
                item.url ||
                item.src ||
                "";


            if (!imageUrl) {
                return;
            }


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "related-item";


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                imageUrl;


            img.alt =
                item.title ||
                currentQuery;


            div.appendChild(
                img
            );


            div.addEventListener(
                "click",
                () => {

                    currentImageIndex =
                        index;

                    zoomLevel =
                        1;

                    imageOffsetX =
                        0;

                    imageOffsetY =
                        0;

                    updateLightboxImage();

                    renderRelatedImages();

                }
            );


            relatedGrid.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   ZOOM
========================================================= */

function updateZoom() {

    lightboxImage.style.transform =
        `translate(
            ${imageOffsetX}px,
            ${imageOffsetY}px
        )
        scale(${zoomLevel})`;

}


function zoomIn() {

    zoomLevel =
        Math.min(
            zoomLevel + .25,
            5
        );

    updateZoom();

}


function zoomOut() {

    zoomLevel =
        Math.max(
            zoomLevel - .25,
            .5
        );

    updateZoom();

}


function resetZoom() {

    zoomLevel =
        1;

    imageOffsetX =
        0;

    imageOffsetY =
        0;

    updateZoom();

}


/* =========================================================
   ZOOM BUTTONS
========================================================= */

zoomInBtn.addEventListener(
    "click",
    zoomIn
);


zoomOutBtn.addEventListener(
    "click",
    zoomOut
);


zoomResetBtn.addEventListener(
    "click",
    resetZoom
);


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

lightboxImage.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoomIn();

        } else {

            zoomOut();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   IMAGE DRAG
========================================================= */

lightboxImage.addEventListener(
    "mousedown",
    event => {

        if (
            zoomLevel <= 1
        ) {
            return;
        }


        dragging =
            true;


        dragStartX =
            event.clientX -
            imageOffsetX;


        dragStartY =
            event.clientY -
            imageOffsetY;

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (!dragging) {
            return;
        }


        imageOffsetX =
            event.clientX -
            dragStartX;


        imageOffsetY =
            event.clientY -
            dragStartY;


        updateZoom();

    }
);


document.addEventListener(
    "mouseup",
    () => {

        dragging =
            false;

    }
);


/* =========================================================
   LIGHTBOX BUTTONS
========================================================= */

lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   BACK BUTTON
========================================================= */

backBtn.addEventListener(
    "click",
    () => {

        if (
            searchPage.style.display !==
            "none"
        ) {

            searchPage.style.display =
                "none";

            home.style.display =
                "flex";

            return;

        }

        window.history.back();

    }
);


/* =========================================================
   RELOAD
========================================================= */

reloadBtn.addEventListener(
    "click",
    () => {

        if (
            currentQuery
        ) {

            loadResults();

        } else {

            location.reload();

        }

    }
);


/* =========================================================
   LOGO
========================================================= */

topLogo.addEventListener(
    "click",
    () => {

        searchPage.style.display =
            "none";

        home.style.display =
            "flex";

        homeSearch.focus();

    }
);


/* =========================================================
   SEARCH BUTTON
========================================================= */

searchBtn.addEventListener(
    "click",
    () => {

        performSearch();

    }
);


/* =========================================================
   LUCKY BUTTON
========================================================= */

luckyBtn.addEventListener(
    "click",
    () => {

        const history =
            getHistory();


        if (
            history.length
        ) {

            const randomQuery =
                history[
                    Math.floor(
                        Math.random() *
                        history.length
                    )
                ];


            homeSearch.value =
                randomQuery;


            performSearch();

        } else {

            homeSearch.focus();

        }

    }
);


/* =========================================================
   CLEAR HISTORY
========================================================= */

clearHistoryBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        clearHistory();

    }
);


/* =========================================================
   ABOUT
========================================================= */

function showAbout() {

    alert(
        "MySearch\n\n" +
        "A local web search engine."
    );

}


aboutBtn.addEventListener(
    "click",
    showAbout
);


/* =========================================================
   DARK MODE
========================================================= */

function setDarkMode(
    enabled
) {

    document.body.classList.toggle(
        "dark",
        enabled
    );


    localStorage.setItem(
        "mysearch-dark",
        enabled
            ? "1"
            : "0"
    );


    darkBtn.textContent =
        enabled
            ? "Light"
            : "Dark";

}


darkBtn.addEventListener(
    "click",
    () => {

        const enabled =
            document.body.classList.contains(
                "dark"
            );

        setDarkMode(
            !enabled
        );

    }
);


/* =========================================================
   RESTORE DARK MODE
========================================================= */

if (
    localStorage.getItem(
        "mysearch-dark"
    ) === "1"
) {

    setDarkMode(
        true
    );

}


/* =========================================================
   KEYBOARD CONTROLS FOR VIEWER
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "show"
            )
        ) {
            return;
        }


        if (
            event.key ===
            "Escape"
        ) {

            closeLightbox();

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            if (
                currentImageIndex <
                imageItems.length - 1
            ) {

                currentImageIndex++;

                updateLightboxImage();

                renderRelatedImages();

            }

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            if (
                currentImageIndex >
                0
            ) {

                currentImageIndex--;

                updateLightboxImage();

                renderRelatedImages();

            }

        }


        if (
            event.key === "+"
        ) {

            zoomIn();

        }


        if (
            event.key === "-"
        ) {

            zoomOut();

        }


        if (
            event.key === "0"
        ) {

            resetZoom();

        }

    }
);


/* INITIALIZE */

historyBox.style.display = "none";
renderHistory();
historyBox.style.display = "none";

</script>

</body>
</html>
