<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySearch</title>
<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
}

body.dark {
    background: #202124;
    color: #e8eaed;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 64px;
    width: 100%;

    display: flex;
    align-items: center;

    padding: 0 18px;

    background: #fff;
    border-bottom: 1px solid #e5e5e5;

    position: sticky;
    top: 0;
    z-index: 5000;
}

body.dark .topbar {
    background: #202124;
    border-color: #3c4043;
}

/* LEFT */

.top-left {
    display: flex;
    align-items: center;
    gap: 4px;

    min-width: 230px;
}

.nav-btn {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 50%;

    background: transparent;
    color: #5f6368;

    font-size: 22px;

    cursor: pointer;
}

.nav-btn:hover {
    background: #f1f3f4;
}

body.dark .nav-btn {
    color: #bdc1c6;
}

body.dark .nav-btn:hover {
    background: #303134;
}

/* LOGO */

.logo {
    margin-left: 8px;

    font-size: 25px;
    font-weight: bold;

    letter-spacing: -1.5px;

    cursor: pointer;
    white-space: nowrap;
}

.logo .b {
    color: #4285f4;
}

.logo .r {
    color: #ea4335;
}

.logo .y {
    color: #fbbc05;
}

.logo .g {
    color: #34a853;
}

/* =========================================================
   TOP SEARCH
========================================================= */

.top-search-area {
    flex: 1;

    display: flex;
    justify-content: flex-start;

    padding: 0 25px;
}

.top-search {
    width: min(680px, 100%);
    height: 46px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 25px;
}

body.dark .top-search {
    background: #303134;
    border-color: #5f6368;
}

.top-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.2);
}

.top-search-icon {
    margin-right: 10px;
    color: #70757a;
    font-size: 18px;
}

.top-search input {
    flex: 1;

    min-width: 0;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font-size: 16px;
}

.top-search-clear {
    display: none;

    border: 0;
    background: transparent;

    color: #70757a;

    font-size: 22px;

    cursor: pointer;
}

.top-search-button {
    border: 0;
    background: transparent;

    color: #4285f4;

    font-size: 18px;

    cursor: pointer;
}

/* RIGHT */

.top-right {
    min-width: 210px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 5px;
}

.top-btn {
    border: 0;
    background: transparent;

    color: inherit;

    padding: 9px 12px;

    border-radius: 7px;

    cursor: pointer;
}

.top-btn:hover {
    background: #f1f3f4;
}

body.dark .top-btn:hover {
    background: #303134;
}

/* =========================================================
   HOME
========================================================= */

.home {
    min-height: calc(100vh - 64px);

    display: flex;
    flex-direction: column;
    align-items: center;

    padding-top: 15vh;
}

.home-logo {
    font-size: 64px;
    font-weight: bold;

    letter-spacing: -4px;

    margin-bottom: 30px;
}

.home-logo .b {
    color: #4285f4;
}

.home-logo .r {
    color: #ea4335;
}

.home-logo .y {
    color: #fbbc05;
}

.home-logo .g {
    color: #34a853;
}

/* =========================================================
   HOME SEARCH
========================================================= */

.home-search-area {
    width: min(650px, 94vw);

    position: relative;
}

.home-search {
    width: 100%;
    height: 54px;

    display: flex;
    align-items: center;

    padding: 0 17px;

    background: #fff;

    border: 1px solid #dfe1e5;
    border-radius: 28px;
}

body.dark .home-search {
    background: #303134;
    border-color: #5f6368;
}

.home-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.2);
}

.home-search-icon {
    margin-right: 11px;

    color: #70757a;
    font-size: 20px;
}

.home-search input {
    flex: 1;

    border: 0;
    outline: 0;

    background: transparent;
    color: inherit;

    font-size: 17px;
}

.home-clear {
    display: none;

    border: 0;
    background: transparent;

    color: #70757a;

    font-size: 22px;

    cursor: pointer;
}

/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    display: none;

    position: absolute;

    left: 0;
    right: 0;
    top: 60px;

    background: #fff;

    border: 1px solid #dfe1e5;
    border-radius: 12px;

    overflow: hidden;

    z-index: 6000;

    box-shadow: 0 5px 15px rgba(0,0,0,.15);
}

body.dark .suggestions {
    background: #303134;
    border-color: #5f6368;
}

.suggestion-item {
    padding: 12px 17px;

    display: flex;
    align-items: center;

    gap: 10px;

    cursor: pointer;
}

.suggestion-item:hover {
    background: #f1f3f4;
}

body.dark .suggestion-item:hover {
    background: #3c4043;
}

/* =========================================================
   HISTORY
========================================================= */

.history-box {
  display: none;
    width: min(650px, 94vw);

    margin-top: 28px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 7px;
}

.history-title {
    color: #5f6368;
    font-size: 14px;
}

body.dark .history-title {
    color: #bdc1c6;
}

.clear-history {
    border: 0;
    background: transparent;

    color: #1a73e8;

    cursor: pointer;

    font-size: 13px;
}

.history-item {
    padding: 9px 5px;

    display: flex;
    align-items: center;

    gap: 10px;

    border-radius: 7px;

    cursor: pointer;
}

.history-item:hover {
    background: #f1f3f4;
}

body.dark .history-item:hover {
    background: #303134;
}

.history-clock {
    color: #70757a;
}

.history-text {
    flex: 1;
}

/* =========================================================
   HOME BUTTONS
========================================================= */

.home-buttons {
    display: flex;
    gap: 12px;

    margin-top: 25px;
}

.home-btn {
    border: 1px solid #f8f9fa;

    background: #f8f9fa;
    color: inherit;

    padding: 10px 19px;

    border-radius: 5px;

    cursor: pointer;
}

body.dark .home-btn {
    background: #303134;
    border-color: #303134;
}

.home-btn:hover {
    border-color: #dadce0;
}

/* =========================================================
   SEARCH PAGE
========================================================= */

.search-page {
    display: none;
}

/* =========================================================
   TABS
========================================================= */

.tabs-bar {
    width: 100%;

    border-bottom: 1px solid #eee;

    padding-left: 22px;

    background: #fff;
}

body.dark .tabs-bar {
    background: #202124;
    border-color: #3c4043;
}

.tabs {
    width: 100%;

    display: flex;

    gap: 28px;
}

.tab {
    border: 0;
    background: transparent;

    color: #5f6368;

    padding: 14px 4px;

    cursor: pointer;

    border-bottom: 3px solid transparent;
}

body.dark .tab {
    color: #bdc1c6;
}

.tab.active {
    color: #1a73e8;
    border-bottom-color: #1a73e8;
}

/* =========================================================
   MAIN CONTENT
   RESULTS LEFT SIDE
========================================================= */

.content {
    width: 100%;

    margin: 0;
    padding: 25px 30px 80px;
}

.status {
    color: #70757a;

    font-size: 13px;

    margin-bottom: 20px;
}

body.dark .status {
    color: #9aa0a6;
}

/* IMPORTANT:
   Results stay on LEFT.
*/

.results {
    width: 780px;
    max-width: 100%;

    margin: 0;
}

/* =========================================================
   RESULT
========================================================= */

.result {
    margin-bottom: 30px;
}

.result-title {
    color: #1a0dab;

    font-size: 20px;
    line-height: 1.3;

    cursor: pointer;
}

body.dark .result-title {
    color: #8ab4f8;
}

.result-title:hover {
    text-decoration: underline;
}

.result-url {
    color: #188038;

    font-size: 13px;

    margin-top: 5px;
    margin-bottom: 5px;

    word-break: break-all;
}

body.dark .result-url {
    color: #81c995;
}

.result-description {
    color: #4d5156;

    font-size: 14px;

    line-height: 1.55;
}

body.dark .result-description {
    color: #bdc1c6;
}

/* =========================================================
   IMAGE GRID
========================================================= */

.image-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(5, minmax(0, 1fr));

    gap: 15px;
}

.image-card {
    height: 175px;

    border-radius: 9px;

    overflow: hidden;

    border: 1px solid #e0e0e0;

    background: #f8f9fa;

    cursor: pointer;

    transition:
        transform .15s,
        box-shadow .15s;
}

body.dark .image-card {
    background: #303134;
    border-color: #5f6368;
}

.image-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 4px 13px rgba(0,0,0,.18);
}

.image-card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    text-align: center;

    padding: 55px 10px;

    color: #70757a;
}

.spinner {
    width: 32px;
    height: 32px;

    border: 3px solid #ddd;

    border-top-color: #4285f4;

    border-radius: 50%;

    margin: 0 auto 14px;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
    padding: 45px 10px;

    text-align: center;

    color: #70757a;
}

.error {
    color: #d93025;
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination {
    width: 780px;
    max-width: 100%;

    display: flex;

    justify-content: flex-start;
    align-items: center;

    gap: 7px;

    margin-top: 45px;

    flex-wrap: wrap;
}

.page-btn {
    min-width: 40px;
    height: 40px;

    padding: 0 12px;

    border: 1px solid #dadce0;
    border-radius: 6px;

    background: #fff;
    color: #202124;

    cursor: pointer;
}

body.dark .page-btn {
    background: #303134;
    color: #e8eaed;
    border-color: #5f6368;
}

.page-btn:hover {
    background: #f1f3f4;
}

body.dark .page-btn:hover {
    background: #3c4043;
}

.page-btn.active {
    background: #1a73e8;
    color: white;

    border-color: #1a73e8;
}

/* =========================================================
   IMAGE VIEWER
========================================================= */

.lightbox {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: rgba(0,0,0,.96);

    flex-direction: column;
}

.lightbox.show {
    display: flex;
}

/* =========================================================
   VIEWER TOP
========================================================= */

.viewer-top {
    height: 60px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    color: white;
}

.viewer-title {
    max-width: 55vw;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;
}

.viewer-actions {
    display: flex;

    gap: 7px;
}

.viewer-btn {
    width: 42px;
    height: 42px;

    border: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.12);

    color: white;

    cursor: pointer;

    font-size: 21px;
}

.viewer-btn:hover {
    background: rgba(255,255,255,.27);
}

/* =========================================================
   VIEWER MAIN
========================================================= */

.viewer-main {
    flex: 1;

    min-height: 0;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.viewer-image-wrap {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    cursor: default;
}

.viewer-image-wrap.zoomed {
    cursor: grab;
}

.viewer-image-wrap.dragging {
    cursor: grabbing;
}

.viewer-image {
    max-width: 88vw;
    max-height: 72vh;

    object-fit: contain;

    user-select: none;

    -webkit-user-drag: none;

    transform-origin: center center;

    transition: transform .12s ease;
}

/* =========================================================
   VIEWER NAVIGATION
========================================================= */

.viewer-nav {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 50px;
    height: 70px;

    border: 0;

    border-radius: 10px;

    background: rgba(0,0,0,.45);

    color: white;

    font-size: 38px;

    cursor: pointer;

    z-index: 10;
}

.viewer-nav:hover {
    background: rgba(0,0,0,.72);
}

.viewer-prev {
    left: 16px;
}

.viewer-next {
    right: 16px;
}

/* =========================================================
   ZOOM CONTROLS
========================================================= */

.zoom-controls {
    position: absolute;

    bottom: 17px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 5px;

    background: rgba(0,0,0,.58);

    padding: 6px;

    border-radius: 25px;

    z-index: 20;
}

.zoom-btn {
    width: 38px;
    height: 38px;

    border: 0;

    border-radius: 50%;

    background: rgba(255,255,255,.13);

    color: white;

    cursor: pointer;

    font-size: 21px;
}

.zoom-btn:hover {
    background: rgba(255,255,255,.27);
}

.zoom-level {
    min-width: 55px;

    text-align: center;

    color: white;

    font-size: 13px;
}

/* =========================================================
   RELATED IMAGES
========================================================= */

.related-section {
    height: 142px;

    flex-shrink: 0;

    padding: 9px 17px 14px;

    background: rgba(0,0,0,.76);
}

.related-title {
    color: white;

    font-size: 13px;

    opacity: .82;

    margin-bottom: 7px;
}

.related-grid {
    height: 94px;

    display: flex;

    gap: 10px;

    overflow-x: auto;
}

.related-card {
    flex: 0 0 105px;

    height: 84px;

    border-radius: 7px;

    overflow: hidden;

    border: 2px solid transparent;

    cursor: pointer;
}

.related-card.active {
    border-color: #4285f4;
}

.related-card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   GOOGLE-STYLE IMAGE DETAILS
========================================================= */
.viewer-source-row {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
}

.viewer-source-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.12);
    color: #fff;
    flex: 0 0 auto;
}

.viewer-source-info {
    min-width: 0;
}

.viewer-source-name {
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.viewer-image-title {
    color: rgba(255,255,255,.72);
    font-size: 12px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: min(55vw, 620px);
}

.viewer-detail-bar {
    flex-shrink: 0;
    background: #fff;
    color: #202124;
    padding: 15px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-top: 1px solid rgba(255,255,255,.12);
}

.viewer-detail-text {
    min-width: 0;
    flex: 1;
}

.viewer-detail-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.viewer-detail-url {
    margin-top: 4px;
    color: #5f6368;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.viewer-detail-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.viewer-action-btn {
    min-height: 38px;
    border: 1px solid #dadce0;
    background: #fff;
    color: #202124;
    border-radius: 20px;
    padding: 0 15px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
}

.viewer-action-btn:hover {
    background: #f8f9fa;
}

.viewer-action-btn.visit {
    background: #1a73e8;
    color: #fff;
    border-color: #1a73e8;
}

.viewer-action-btn.visit:hover {
    background: #1765cc;
}

.viewer-action-btn.saved {
    background: #e8f0fe;
    color: #1967d2;
    border-color: #aecbfa;
}

.viewer-menu {
    position: relative;
}

.viewer-menu-panel {
    display: none;
    position: absolute;
    right: 0;
    bottom: 46px;
    width: 190px;
    padding: 6px;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 5px 24px rgba(0,0,0,.25);
    z-index: 100;
}

.viewer-menu.open .viewer-menu-panel {
    display: block;
}

.viewer-menu-item {
    width: 100%;
    border: 0;
    background: transparent;
    text-align: left;
    padding: 10px 11px;
    border-radius: 7px;
    cursor: pointer;
    color: #202124;
    font-size: 14px;
}

.viewer-menu-item:hover {
    background: #f1f3f4;
}

body.dark .viewer-detail-bar {
    background: #202124;
    color: #e8eaed;
}

body.dark .viewer-detail-url {
    color: #9aa0a6;
}

body.dark .viewer-action-btn {
    background: #303134;
    color: #e8eaed;
    border-color: #5f6368;
}

body.dark .viewer-action-btn:hover {
    background: #3c4043;
}

body.dark .viewer-action-btn.saved {
    background: #174ea6;
    color: #fff;
    border-color: #4285f4;
}

body.dark .viewer-menu-panel {
    background: #303134;
}

body.dark .viewer-menu-item {
    color: #e8eaed;
}

body.dark .viewer-menu-item:hover {
    background: #3c4043;
}

.viewer-image-wrap {
    touch-action: none;
    overscroll-behavior: contain;
}

.viewer-image {
    will-change: transform;
}

@media (max-width: 750px) {
    .viewer-top {
        height: 56px;
        padding: 0 9px;
    }

    .viewer-title {
        max-width: 52vw;
    }

    .viewer-actions {
        gap: 3px;
    }

    .viewer-btn {
        width: 38px;
        height: 38px;
        font-size: 19px;
    }

    .viewer-detail-bar {
        align-items: stretch;
        flex-direction: column;
        padding: 12px 14px;
        gap: 10px;
    }

    .viewer-detail-title,
    .viewer-detail-url {
        white-space: normal;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
    }

    .viewer-detail-actions {
        width: 100%;
    }

    .viewer-action-btn {
        flex: 1;
        padding: 0 10px;
    }

    .viewer-image {
        max-width: 100vw;
        max-height: 62vh;
    }

    .related-section {
        height: 112px;
        padding: 7px 10px 10px;
    }

    .related-grid {
        height: 72px;
    }

    .related-card {
        flex-basis: 86px;
        height: 66px;
    }

    .zoom-controls {
        bottom: 10px;
    }
}

/* =========================================================
   HOME MODE
========================================================= */

body.home-mode .top-search-area {
    display: none;
}

body.home-mode .top-left {
    flex: 1;
}

body.home-mode .top-right {
    flex: 1;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

    .top-left {
        min-width: 190px;
    }

    .top-right {
        min-width: 160px;
    }

    .image-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}

@media (max-width: 750px) {

    .topbar {
        padding: 0 10px;
    }

    .top-left {
        min-width: auto;
    }

    .top-right {
        min-width: auto;
    }

    .logo {
        font-size: 21px;
    }

    .top-search-area {
        padding: 0 8px;
    }

    .tabs {
        gap: 18px;

        overflow-x: auto;
    }

    .content {
        padding-left: 15px;
        padding-right: 15px;
    }

    .image-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .image-card {
        height: 155px;
    }

    .viewer-image {
        max-width: 96vw;

<script>

/* =========================================================
   VARIABLES
========================================================= */

let currentQuery = "";

let currentPage = 1;

let currentTab = "all";

let currentImages = [];

let currentImageIndex = 0;

let zoomValue = 1;

let translateX = 0;

let translateY = 0;

let dragging = false;

let dragStartX = 0;

let dragStartY = 0;

let startTranslateX = 0;

let startTranslateY = 0;

let pointerCache = new Map();
let pinchStartDistance = 0;
let pinchStartZoom = 1;
let pointerMoved = false;
let viewerMenuOpen = false;


/* =========================================================
   ELEMENTS
========================================================= */

const home =
    document.getElementById("home");

const searchPage =
    document.getElementById("searchPage");

const homeSearch =
    document.getElementById("homeSearch");

const topSearchInput =
    document.getElementById("topSearchInput");

const suggestions =
    document.getElementById("suggestions");

const historyBox =
    document.getElementById("historyBox");

const historyList =
    document.getElementById("historyList");

const homeClear =
    document.getElementById("homeClear");

const topSearchClear =
    document.getElementById("topSearchClear");

const resultsBox =
    document.getElementById("results");

const imageGrid =
    document.getElementById("imageGrid");

const statusBox =
    document.getElementById("status");

const pagination =
    document.getElementById("pagination");

const lightbox =
    document.getElementById("lightbox");

const viewerImage =
    document.getElementById("viewerImage");

const viewerImageWrap =
    document.getElementById("viewerImageWrap");

const viewerTitle =
    document.getElementById("viewerTitle");

const relatedGrid =
    document.getElementById("relatedGrid");

const zoomLevel =
    document.getElementById("zoomLevel");

const viewerSourceIcon =
    document.getElementById("viewerSourceIcon");

const viewerImageTitle =
    document.getElementById("viewerImageTitle");

const viewerDetailTitle =
    document.getElementById("viewerDetailTitle");

const viewerDetailUrl =
    document.getElementById("viewerDetailUrl");

const viewerVisitBtn =
    document.getElementById("viewerVisitBtn");

const viewerSaveBtn =
    document.getElementById("viewerSaveBtn");

const viewerMenu =
    document.getElementById("viewerMenu");


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

    try {

        const saved =
            localStorage.getItem(
                "mysearch-history"
            );

        if (!saved) {
            return [];
        }

        const data =
            JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    } catch {

        return [];

    }
}


function saveHistory(query) {

    query =
        String(query).trim();

    if (!query) {
        return;
    }

    let history =
        getHistory();

    history =
        history.filter(
            item =>
                item.toLowerCase() !==
                query.toLowerCase()
        );

    history.unshift(query);

    history =
        history.slice(0, 10);

    localStorage.setItem(
        "mysearch-history",
        JSON.stringify(history)
    );

    renderHistory();
}

function renderHistory() {

    const history =
        getHistory();

    historyList.innerHTML = "";

    if (!history.length) {

        historyBox.style.display =
            "none";

        return;
    }

    history.forEach(
        query => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.innerHTML = `
                <span class="history-clock">
                    🕘
                </span>

                <span class="history-text">
                    ${escapeHtml(query)}
                </span>
            `;

            item.addEventListener(
                "click",
                () => {

                    homeSearch.value =
                        query;

                    historyBox.style.display =
                        "none";

                    performSearch();

                }
            );

            historyList.appendChild(
                item
            );

        }
    );
}


function clearHistory() {

    localStorage.removeItem(
        "mysearch-history"
    );

    renderHistory();
}


/* =========================================================
   SUGGESTIONS
========================================================= */

function renderSuggestions() {

    const value =
        homeSearch.value
            .trim()
            .toLowerCase();

    suggestions.innerHTML = "";

    if (!value) {

        suggestions.style.display =
            "none";

        return;
    }

    const matches =
        getHistory().filter(
            item =>
                item.toLowerCase()
                    .includes(value)
        );

    if (!matches.length) {

        suggestions.style.display =
            "none";

        return;
    }

    matches
        .slice(0, 6)
        .forEach(
            query => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "suggestion-item";

                item.innerHTML = `
                    <span>🕘</span>
                    <span>
                        ${escapeHtml(query)}
                    </span>
                `;

                item.addEventListener(
                    "click",
                    () => {

                        homeSearch.value =
                            query;

                        suggestions.style.display =
                            "none";

                        performSearch();

                    }
                );

                suggestions.appendChild(
                    item
                );

            }
        );

    suggestions.style.display =
        "block";
}


/* =========================================================
   HOME INPUT
========================================================= */
homeSearch.addEventListener(
    "focus",
    () => {

        const history =
            getHistory();

        if (!history.length) {
            return;
        }

        historyBox.style.display =
            "block";

    }
);

homeSearch.addEventListener(
    "input",
    () => {

        homeClear.style.display =
            homeSearch.value
                ? "block"
                : "none";

        renderSuggestions();

    }
);


homeSearch.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            suggestions.style.display =
                "none";

            performSearch();

        }

    }
);


/* =========================================================
   TOP INPUT
========================================================= */

topSearchInput.addEventListener(
    "input",
    () => {

        topSearchClear.style.display =
            topSearchInput.value
                ? "block"
                : "none";

    }
);


topSearchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            performSearch();

        }

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearHomeSearch() {

    homeSearch.value = "";

    homeClear.style.display =
        "none";

    suggestions.style.display =
        "none";

    homeSearch.focus();
}


function clearTopSearch() {

    topSearchInput.value = "";

    topSearchClear.style.display =
        "none";

    topSearchInput.focus();
}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    currentQuery = "";

    currentPage = 1;

    currentTab = "all";

    home.style.display =
        "flex";

    searchPage.style.display =
        "none";

    document.body.classList.add(
        "home-mode"
    );

    topSearchInput.value = "";

    topSearchClear.style.display =
        "none";

  
}


/* =========================================================
   PERFORM WEB SEARCH
========================================================= */

function performSearch() {

    const query =
        document.body.classList.contains(
            "home-mode"
        )
            ? homeSearch.value.trim()
            : topSearchInput.value.trim();

    if (!query) {
        return;
    }

    currentQuery =
        query;

    currentPage = 1;

    currentTab = "all";

    saveHistory(query);

    home.style.display =
        "none";

    searchPage.style.display =
        "block";

    document.body.classList.remove(
        "home-mode"
    );

    topSearchInput.value =
        query;

    topSearchClear.style.display =
        "block";

    activateTab("all");

    search(1);
}


/* =========================================================
   WEB SEARCH
========================================================= */

async function search(page = 1) {

    currentPage =
        page;

    resultsBox.style.display =
        "block";

    imageGrid.style.display =
        "none";

    pagination.innerHTML =
        "";

    resultsBox.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Searching...

        </div>
    `;

    statusBox.textContent =
        `Searching for "${currentQuery}"...`;

    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    currentQuery
                ) +
                "&page=" +
                page
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Search failed"
            );

        }

        const results =
            Array.isArray(
                data.results
            )
                ? data.results
                : [];

        if (!results.length) {

            resultsBox.innerHTML = `
                <div class="message">
                    No results found.
                </div>
            `;

            statusBox.textContent =
                `No results for "${currentQuery}"`;

            return;
        }

        statusBox.textContent =
            `Search results for "${currentQuery}"`;

        resultsBox.innerHTML =
            "";

        results.forEach(
            result => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "result";

                const title =
                    escapeHtml(
                        result.title ||
                        "Untitled"
                    );

                const link =
                    String(
                        result.link ||
                        result.url ||
                        "#"
                    );

                const description =
                    escapeHtml(
                        result.description ||
                        ""
                    );

                item.innerHTML = `
                    <div class="result-title">
                        ${title}
                    </div>

                    <div class="result-url">
                        ${escapeHtml(link)}
                    </div>

                    <div class="result-description">
                        ${description}
                    </div>
                `;

                item
                    .querySelector(
                        ".result-title"
                    )
                    .addEventListener(
                        "click",
                        () => {

                            if (
                                link &&
                                link !== "#"
                            ) {

                                window.open(
                                    link,
                                    "_blank"
                                );

                            }

                        }
                    );

                resultsBox.appendChild(
                    item
                );

            }
        );

        createPagination(
            page,
            Boolean(data.hasMore),
            search,
            Number(
                data.totalPages || 0
            )
        );

    } catch (error) {

        console.error(error);

        resultsBox.innerHTML = `
            <div class="message error">

                Search failed.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;

        statusBox.textContent =
            "Search error.";
    }
}


/* =========================================================
   IMAGE SEARCH
========================================================= */

function performImageSearch() {

    const query =
        document.body.classList.contains(
            "home-mode"
        )
            ? homeSearch.value.trim()
            : topSearchInput.value.trim();

    if (!query) {
        return;
    }

    currentQuery =
        query;

    currentPage =
        1;

    currentTab =
        "images";

    saveHistory(query);

    home.style.display =
        "none";

    searchPage.style.display =
        "block";

    document.body.classList.remove(
        "home-mode"
    );

    topSearchInput.value =
        query;

    topSearchClear.style.display =
        "block";

    activateTab("images");

    showImages(1);
}


/* =========================================================
   TABS
========================================================= */

function showTab(tab) {

    closeLightbox();
    currentTab =
        tab;

    activateTab(tab);

    if (tab === "all") {

        search(1);

        return;
    }

    if (tab === "images") {

        showImages(1);

        return;
    }

    if (tab === "news") {

        showComingSoon(
            "News search"
        );

        return;
    }

    if (tab === "videos") {

        showComingSoon(
            "Video search"
        );

        return;
    }
}


function activateTab(tab) {

    document
        .querySelectorAll(".tab")
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );

    const ids = {

        all:
            "tabAll",

        images:
            "tabImages",

        news:
            "tabNews",

        videos:
            "tabVideos"

    };

    const selected =
        document.getElementById(
            ids[tab]
        );

    if (selected) {

        selected.classList.add(
            "active"
        );

    }
}


/* =========================================================
   IMAGE SEARCH
========================================================= */

async function showImages(page = 1) {

    currentPage =
        page;

    resultsBox.style.display =
        "none";

    imageGrid.style.display =
        "grid";

    pagination.innerHTML =
        "";

    imageGrid.innerHTML = `
        <div
            class="loading"
            style="grid-column:1/-1;"
        >

            <div class="spinner"></div>

            Loading images...

        </div>
    `;

    statusBox.textContent =
        `Images for "${currentQuery}"`;

    try {

        const response =
            await fetch(
                "/api/images?q=" +
                encodeURIComponent(
                    currentQuery
                ) +
                "&page=" +
                page
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image search failed"
            );

        }

        const images =
            Array.isArray(
                data.images
            )
                ? data.images
                : [];

        /*
           IMPORTANT:
           currentImages gets the actual image
           objects returned by the backend.
        */

        currentImages =
            images;

        if (!images.length) {

            imageGrid.innerHTML = `
                <div
                    class="message"
                    style="grid-column:1/-1;"
                >
                    No images found.
                </div>
            `;

            return;
        }

        imageGrid.innerHTML =
            "";

        images.forEach(
            (item, index) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "image-card";

                const img =
                    document.createElement(
                        "img"
                    );

                /*
                   IMPORTANT:
                   Use item.image.
                   Do NOT use item.original here.
                */

                img.src =
                    item.image;

                img.alt =
                    item.title ||
                    "Search image";

                img.loading =
                    "lazy";

                /*
                   Clicking anywhere on the card
                   opens the viewer.
                */

                card.addEventListener(
                    "click",
                    () => {

                        openLightbox(
                            index
                        );

                    }
                );

                img.addEventListener(
                    "error",
                    () => {

                        card.style.display =
                            "none";

                    }
                );

                card.appendChild(
                    img
                );

                imageGrid.appendChild(
                    card
                );

            }
        );

        createPagination(
            page,
            Boolean(data.hasMore),
            showImages,
            Number(
                data.totalPages || 0
            )
        );

    } catch (error) {

        console.error(error);

        imageGrid.innerHTML = `
            <div
                class="message error"
                style="grid-column:1/-1;"
            >

                Image search failed.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;

    }
}


/* =========================================================
   OPEN IMAGE VIEWER
========================================================= */

function openLightbox(index) {

    if (!currentImages.length) {
        return;
    }

    currentImageIndex =
        Math.max(
            0,
            Math.min(
                index,
                currentImages.length - 1
            )
        );

    lightbox.classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";

    closeViewerMenu();
    renderViewerImage();
    renderRelatedImages();
    resetZoom();
}


/* =========================================================
   CLOSE IMAGE VIEWER
========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";

    viewerImage.src =
        "";

    closeViewerMenu();
    pointerCache.clear();
    dragging = false;
}


/* =========================================================
   VIEWER IMAGE
========================================================= */

function getCurrentImageItem() {
    return currentImages[currentImageIndex] || null;
}

function getPageUrl(item) {
    if (!item) return "";
    return String(item.page || item.url || item.link || item.original || "").trim();
}

function getImageUrl(item) {
    if (!item) return "";
    return String(item.image || item.thumbnail || item.src || "").trim();
}

function getImageTitle(item, index = currentImageIndex) {
    if (!item) return "Selected image";
    return String(item.title || item.name || item.caption || `Image ${index + 1}`).trim();
}

function getSourceName(item) {
    const pageUrl = getPageUrl(item);
    try {
        const url = new URL(pageUrl);
        return url.hostname.replace(/^www\./, "") || "Web image";
    } catch {
        return item && item.source ? String(item.source) : "Web image";
    }
}

function getSavedImages() {
    try {
        const data = JSON.parse(localStorage.getItem("mysearch-saved-images") || "[]");
        return Array.isArray(data) ? data : [];
    } catch {
        return [];
    }
}

function isCurrentImageSaved() {
    const item = getCurrentImageItem();
    const imageUrl = getImageUrl(item);
    if (!imageUrl) return false;
    return getSavedImages().some(saved => saved.image === imageUrl);
}

function updateSaveButton() {
    if (!viewerSaveBtn) return;
    if (isCurrentImageSaved()) {
        viewerSaveBtn.textContent = "✓ Saved";
        viewerSaveBtn.classList.add("saved");
    } else {
        viewerSaveBtn.textContent = "🔖 Save";
        viewerSaveBtn.classList.remove("saved");
    }
}

function renderViewerImage() {
    const item = getCurrentImageItem();
    if (!item) return;

    const imageUrl = getImageUrl(item);
    const pageUrl = getPageUrl(item);
    const title = getImageTitle(item);
    const source = getSourceName(item);

    viewerImage.src = imageUrl;
    viewerImage.alt = title;
    viewerTitle.textContent = source;
    viewerImageTitle.textContent = title;
    viewerDetailTitle.textContent = title;
    viewerDetailUrl.textContent = pageUrl || source;
    viewerSourceIcon.textContent = source ? source.charAt(0).toUpperCase() : "🌐";

    viewerVisitBtn.disabled = !pageUrl;
    viewerVisitBtn.style.opacity = pageUrl ? "1" : ".55";
    updateSaveButton();
    resetZoom();
    updateRelatedActive();
}

function visitCurrentImage() {
    const item = getCurrentImageItem();
    const url = getPageUrl(item);
    if (!url) return;
    try {
        const parsed = new URL(url, location.href);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return;
        window.open(parsed.href, "_blank", "noopener,noreferrer");
    } catch {}
}

async function shareCurrentImage() {
    const item = getCurrentImageItem();
    const imageUrl = getImageUrl(item);
    const pageUrl = getPageUrl(item) || imageUrl;
    const title = getImageTitle(item);

    try {
        if (navigator.share) {
            await navigator.share({ title, text: title, url: pageUrl });
            return;
        }
    } catch (error) {
        if (error && error.name === "AbortError") return;
    }

    try {
        await navigator.clipboard.writeText(pageUrl || imageUrl);
        alert("Image link copied.");
    } catch {
        prompt("Copy this link:", pageUrl || imageUrl);
    }
}

function toggleSaveCurrentImage() {
    const item = getCurrentImageItem();
    const imageUrl = getImageUrl(item);
    if (!imageUrl) return;

    let saved = getSavedImages();
    const existing = saved.findIndex(item => item.image === imageUrl);

    if (existing >= 0) {
        saved.splice(existing, 1);
    } else {
        saved.unshift({
            image: imageUrl,
            page: getPageUrl(item),
            title: getImageTitle(item)
        });
        saved = saved.slice(0, 100);
    }

    localStorage.setItem("mysearch-saved-images", JSON.stringify(saved));
    updateSaveButton();
}

function toggleViewerMenu() {
    viewerMenuOpen = !viewerMenuOpen;
    viewerMenu.classList.toggle("open", viewerMenuOpen);
}

function closeViewerMenu() {
    viewerMenuOpen = false;
    if (viewerMenu) viewerMenu.classList.remove("open");
}

async function copyCurrentImageUrl() {
    const item = getCurrentImageItem();
    const url = getImageUrl(item);
    if (!url) return;
    try {
        await navigator.clipboard.writeText(url);
        alert("Image URL copied.");
    } catch {
        prompt("Copy image URL:", url);
    }
    closeViewerMenu();
}

function downloadCurrentImage() {
    const item = getCurrentImageItem();
    const url = getImageUrl(item);
    if (!url) return;
    window.open(url, "_blank", "noopener,noreferrer");
    closeViewerMenu();
}

/* =========================================================
   NEXT IMAGE
========================================================= */

function nextImage() {

    if (!currentImages.length) {
        return;
    }

    currentImageIndex++;

    if (
        currentImageIndex >=
        currentImages.length
    ) {

        currentImageIndex = 0;

    }

    renderViewerImage();

    renderRelatedImages();
}


/* =========================================================
   PREVIOUS IMAGE
========================================================= */

function previousImage() {

    if (!currentImages.length) {
        return;
    }

    currentImageIndex--;

    if (
        currentImageIndex < 0
    ) {

        currentImageIndex =
            currentImages.length - 1;

    }

    renderViewerImage();

    renderRelatedImages();
}


/* =========================================================
   ZOOM IN
========================================================= */

function zoomIn() {

    zoomValue += 0.25;

    if (zoomValue > 5) {

        zoomValue = 5;

    }

    applyTransform();
}


/* =========================================================
   ZOOM OUT
========================================================= */

function zoomOut() {

    zoomValue -= 0.25;

    if (zoomValue < 0.5) {

        zoomValue = 0.5;

    }

    if (zoomValue <= 1) {

        translateX = 0;

        translateY = 0;

    }

    applyTransform();
}


/* =========================================================
   RESET ZOOM
========================================================= */

function resetZoom() {

    zoomValue = 1;

    translateX = 0;

    translateY = 0;

    applyTransform();
}


/* =========================================================
   APPLY ZOOM TRANSFORM
========================================================= */

function applyTransform() {

    viewerImage.style.transform =
        `translate(
            ${translateX}px,
            ${translateY}px
        ) scale(${zoomValue})`;

    zoomLevel.textContent =
        Math.round(
            zoomValue * 100
        ) + "%";

    viewerImageWrap.classList.toggle(
        "zoomed",
        zoomValue > 1
    );
}


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

viewerImageWrap.addEventListener("wheel", event => {
    if (!lightbox.classList.contains("show")) return;
    event.preventDefault();
    if (event.deltaY < 0) zoomIn();
    else zoomOut();
}, { passive: false });

function distanceBetweenPointers() {
    const points = Array.from(pointerCache.values());
    if (points.length < 2) return 0;
    return Math.hypot(
        points[0].clientX - points[1].clientX,
        points[0].clientY - points[1].clientY
    );
}

function pointerDown(event) {
    if (!lightbox.classList.contains("show")) return;
    pointerCache.set(event.pointerId, event);
    viewerImageWrap.setPointerCapture?.(event.pointerId);
    pointerMoved = false;

    if (pointerCache.size === 2) {
        pinchStartDistance = distanceBetweenPointers();
        pinchStartZoom = zoomValue;
        dragging = false;
        viewerImageWrap.classList.remove("dragging");
        return;
    }

    if (event.pointerType === "mouse" && event.button !== 0) return;
    if (zoomValue <= 1) return;

    dragging = true;
    viewerImageWrap.classList.add("dragging");
    dragStartX = event.clientX;
    dragStartY = event.clientY;
    startTranslateX = translateX;
    startTranslateY = translateY;
}

function pointerMove(event) {
    if (!pointerCache.has(event.pointerId)) return;
    pointerCache.set(event.pointerId, event);

    if (pointerCache.size >= 2) {
        const distance = distanceBetweenPointers();
        if (!pinchStartDistance || !distance) return;

        const ratio = distance / pinchStartDistance;
        zoomValue = Math.min(5, Math.max(1, pinchStartZoom * ratio));
        if (zoomValue <= 1) {
            translateX = 0;
            translateY = 0;
        }
        applyTransform();
        pointerMoved = true;
        return;
    }

    if (!dragging || zoomValue <= 1) return;

    translateX = startTranslateX + event.clientX - dragStartX;
    translateY = startTranslateY + event.clientY - dragStartY;
    applyTransform();
    pointerMoved = true;
}

function pointerUp(event) {
    pointerCache.delete(event.pointerId);
    if (pointerCache.size < 2) pinchStartDistance = 0;
    if (pointerCache.size === 0) {
        dragging = false;
        viewerImageWrap.classList.remove("dragging");
    }
}

viewerImageWrap.addEventListener("pointerdown", pointerDown);
viewerImageWrap.addEventListener("pointermove", pointerMove);
viewerImageWrap.addEventListener("pointerup", pointerUp);
viewerImageWrap.addEventListener("pointercancel", pointerUp);
viewerImageWrap.addEventListener("pointerleave", pointerUp);

/* =========================================================
   RELATED IMAGES
========================================================= */

function renderRelatedImages() {

    relatedGrid.innerHTML =
        "";

    currentImages.forEach(
        (item, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "related-card";

            if (
                index ===
                currentImageIndex
            ) {

                card.classList.add(
                    "active"
                );

            }

            const img =
                document.createElement(
                    "img"
                );

            /*
               Related image also uses item.image.
            */

            img.src =
                item.image;

            img.alt =
                item.title ||
                "Related image";

            img.loading =
                "lazy";

            img.addEventListener(
                "error",
                () => {

                    card.style.display =
                        "none";

                }
            );

            card.appendChild(
                img
            );

            card.addEventListener(
                "click",
                () => {

                    currentImageIndex =
                        index;

                    renderViewerImage();

                    renderRelatedImages();

                }
            );

            relatedGrid.appendChild(
                card
            );

        }
    );
}


/* =========================================================
   UPDATE RELATED ACTIVE
========================================================= */

function updateRelatedActive() {

    const cards =
        relatedGrid.querySelectorAll(
            ".related-card"
        );

    cards.forEach(
        (card, index) => {

            card.classList.toggle(
                "active",
                index ===
                currentImageIndex
            );

        }
    );
}


/* =========================================================
   PAGINATION
========================================================= */

function createPagination(
    page,
    hasMore,
    callback,
    totalPages = 0
) {

    pagination.innerHTML =
        "";

    if (page > 1) {

        pagination.appendChild(
            createPageButton(
                "‹ Previous",
                () => {

                    callback(
                        page - 1
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            )
        );

    }

    let start =
        Math.max(
            1,
            page - 3
        );

    let end =
        page + 3;

    if (totalPages > 0) {

        end =
            Math.min(
                end,
                totalPages
            );

    }

    if (start > 1) {

        pagination.appendChild(
            createPageButton(
                "1",
                () => callback(1),
                page === 1
            )
        );

        if (start > 2) {

            const dots =
                document.createElement(
                    "span"
                );

            dots.textContent =
                "...";

            pagination.appendChild(
                dots
            );

        }

    }

    for (
        let i = start;
        i <= end;
        i++
    ) {

        pagination.appendChild(
            createPageButton(
                String(i),
                () => {

                    callback(i);

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                },
                i === page
            )
        );

    }

    if (hasMore) {

        pagination.appendChild(
            createPageButton(
                "Next ›",
                () => {

                    callback(
                        page + 1
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            )
        );

    }
}


/* =========================================================
   PAGE BUTTON
========================================================= */

function createPageButton(
    text,
    callback,
    active = false
) {

    const button =
        document.createElement(
            "button"
        );

    button.className =
        "page-btn";

    button.textContent =
        text;

    if (active) {

        button.classList.add(
            "active"
        );

    }

    button.addEventListener(
        "click",
        callback
    );

    return button;
}


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    if (
        lightbox.classList.contains(
            "show"
        )
    ) {

        closeLightbox();

        return;
    }

    if (
        !document.body.classList.contains(
            "home-mode"
        )
    ) {

        goHome();

        return;
    }

    if (
        window.history.length > 1
    ) {

        window.history.back();

    }
}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

    window.location.reload();

}


/* =========================================================
   COMING SOON
========================================================= */

function showComingSoon(name) {

    resultsBox.style.display =
        "block";

    imageGrid.style.display =
        "none";

    pagination.innerHTML =
        "";

    statusBox.textContent =
        name;

    resultsBox.innerHTML = `
        <div class="message">
            🚧
            ${escapeHtml(name)}
            is not connected yet.
        </div>
    `;
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );

    localStorage.setItem(
        "mysearch-dark",
        document.body.classList.contains(
            "dark"
        )
            ? "1"
            : "0"
    );
}


if (
    localStorage.getItem(
        "mysearch-dark"
    ) === "1"
) {

    document.body.classList.add(
        "dark"
    );

}


/* =========================================================
   ABOUT
========================================================= */

function showAbout() {

    alert(
        "MySearch\n\n" +
        "A local web search engine."
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   KEYBOARD CONTROLS FOR VIEWER
========================================================= */


document.addEventListener("click", event => {
    if (viewerMenuOpen && viewerMenu && !viewerMenu.contains(event.target)) {
        closeViewerMenu();
    }
});

document.addEventListener(
    "keydown",
    event => {

        if (
            !lightbox.classList.contains(
                "show"
            )
        ) {
            return;
        }

        if (event.key === "Escape") {

            closeLightbox();

        }

        if (event.key === "ArrowRight") {

            nextImage();

        }

        if (event.key === "ArrowLeft") {

            previousImage();

        }

        if (event.key === "+") {

            zoomIn();

        }

        if (event.key === "-") {

            zoomOut();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

renderHistory();

</script>
