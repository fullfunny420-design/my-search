<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MySearch</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #202124;
}

body.dark {
    background: #202124;
    color: #e8eaed;
}

button,
input {
    font-family: inherit;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 62px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid #e5e5e5;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 1000;
}

body.dark .topbar {
    background: #202124;
    border-color: #3c4043;
}


/* LEFT */

.top-left {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 210px;
}


/* NAV BUTTON */

.nav-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #5f6368;
    font-size: 21px;
    cursor: pointer;
}

.nav-btn:hover {
    background: #f1f3f4;
}

body.dark .nav-btn {
    color: #bdc1c6;
}

body.dark .nav-btn:hover {
    background: #303134;
}


/* LOGO */

.logo {
    margin-left: 7px;
    font-size: 25px;
    font-weight: bold;
    letter-spacing: -1.5px;
    cursor: pointer;
    white-space: nowrap;
}

.logo .b,
.home-logo .b {
    color: #4285f4;
}

.logo .r,
.home-logo .r {
    color: #ea4335;
}

.logo .y,
.home-logo .y {
    color: #fbbc05;
}

.logo .g,
.home-logo .g {
    color: #34a853;
}


/* =========================================================
   TOP SEARCH
========================================================= */

.top-search-area {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 20px;
}

.top-search {
    width: min(650px, 100%);
    height: 46px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: #fff;
}

body.dark .top-search {
    background: #303134;
    border-color: #5f6368;
}

.top-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.18);
}

.top-search-icon {
    color: #70757a;
    font-size: 18px;
    margin-right: 10px;
}

.top-search input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font-size: 16px;
}

.top-search-clear {
    border: 0;
    background: transparent;
    color: #70757a;
    font-size: 20px;
    cursor: pointer;
    display: none;
}

.top-search-button {
    border: 0;
    background: transparent;
    color: #4285f4;
    font-size: 19px;
    cursor: pointer;
}


/* RIGHT */

.top-right {
    min-width: 210px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
}

.top-btn {
    border: 0;
    background: transparent;
    color: inherit;
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.top-btn:hover {
    background: #f1f3f4;
}

body.dark .top-btn:hover {
    background: #303134;
}


/* =========================================================
   HOME
========================================================= */

.home {
    min-height: calc(100vh - 62px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 15vh;
}

.home-logo {
    font-size: 64px;
    font-weight: bold;
    letter-spacing: -4px;
    margin-bottom: 30px;
}


/* HOME SEARCH */

.home-search-area {
    width: min(650px, 94vw);
    position: relative;
}

.home-search {
    width: 100%;
    height: 53px;
    border: 1px solid #dfe1e5;
    border-radius: 28px;
    display: flex;
    align-items: center;
    padding: 0 17px;
    background: #fff;
}

body.dark .home-search {
    background: #303134;
    border-color: #5f6368;
}

.home-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.2);
}

.home-search-icon {
    color: #70757a;
    font-size: 20px;
    margin-right: 11px;
}

.home-search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: inherit;
    font-size: 17px;
}

.home-clear {
    border: 0;
    background: transparent;
    color: #70757a;
    font-size: 21px;
    cursor: pointer;
    display: none;
}


/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 58px;
    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 12px;
    overflow: hidden;
    z-index: 2000;
    box-shadow: 0 4px 12px rgba(0,0,0,.14);
}

body.dark .suggestions {
    background: #303134;
    border-color: #5f6368;
}

.suggestion-item {
    padding: 11px 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
}

.suggestion-item:hover {
    background: #f1f3f4;
}

body.dark .suggestion-item:hover {
    background: #3c4043;
}


/* =========================================================
   HISTORY
========================================================= */

.history-box {
    width: min(650px, 94vw);
    margin-top: 28px;
    display: none;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.history-title {
    color: #5f6368;
    font-size: 14px;
}

body.dark .history-title {
    color: #bdc1c6;
}

.clear-history {
    border: 0;
    background: transparent;
    color: #1a73e8;
    cursor: pointer;
    font-size: 13px;
}

.history-item {
    padding: 9px 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 6px;
    cursor: pointer;
}

.history-item:hover {
    background: #f1f3f4;
}

body.dark .history-item:hover {
    background: #303134;
}

.history-clock {
    color: #70757a;
}

.history-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* =========================================================
   HOME BUTTONS
========================================================= */

.home-buttons {
    display: flex;
    gap: 12px;
    margin-top: 25px;
}

.home-btn {
    border: 1px solid #f8f9fa;
    background: #f8f9fa;
    color: inherit;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
}

body.dark .home-btn {
    background: #303134;
    border-color: #303134;
}

.home-btn:hover {
    border-color: #dadce0;
}


/* =========================================================
   SEARCH PAGE
========================================================= */

.search-page {
    display: none;
}


/* =========================================================
   TABS
========================================================= */

.tabs-bar {
    border-bottom: 1px solid #eee;
    padding-left: 22px;
    background: #fff;
}

body.dark .tabs-bar {
    background: #202124;
    border-color: #3c4043;
}

.tabs {
    max-width: 1000px;
    margin: auto;
    display: flex;
    gap: 28px;
}

.tab {
    border: 0;
    background: transparent;
    color: #5f6368;
    padding: 14px 4px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
}

body.dark .tab {
    color: #bdc1c6;
}

.tab.active {
    color: #1a73e8;
    border-bottom-color: #1a73e8;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
    width: calc(100% - 44px);
    margin: 0;
    padding: 24px 0 80px 22px;
}


/* STATUS */

.status {
    color: #70757a;
    font-size: 13px;
    margin-bottom: 20px;
}

body.dark .status {
    color: #9aa0a6;
}


/* =========================================================
   RESULTS
========================================================= */

.results {
    width: min(780px, 100%);
    margin-left: 0;
}

.result {
    margin-bottom: 28px;
}

.result-title {
    color: #1a0dab;
    font-size: 20px;
    line-height: 1.3;
    cursor: pointer;
}

body.dark .result-title {
    color: #8ab4f8;
}

.result-title:hover {
    text-decoration: underline;
}

.result-url {
    color: #188038;
    font-size: 13px;
    margin-top: 5px;
    margin-bottom: 5px;
    word-break: break-all;
}

body.dark .result-url {
    color: #81c995;
}

.result-description {
    color: #4d5156;
    font-size: 14px;
    line-height: 1.55;
}

body.dark .result-description {
    color: #bdc1c6;
}


/* =========================================================
   IMAGE GRID
========================================================= */

.image-grid {
    width: min(1000px, 100%);
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 15px;
}

.image-card {
    height: 175px;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid #e0e0e0;
    background: #f8f9fa;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
}

body.dark .image-card {
    background: #303134;
    border-color: #5f6368;
}

.image-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 13px rgba(0,0,0,.18);
}

.image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =========================================================
   LOADING
========================================================= */

.loading {
    text-align: center;
    padding: 55px 10px;
    color: #70757a;
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #ddd;
    border-top-color: #4285f4;
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
    padding: 45px 10px;
    text-align: center;
    color: #70757a;
}

.error {
    color: #d93025;
}


/* =========================================================
   PAGINATION
========================================================= */

.pagination {
    width: 780px;
    max-width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-top: 45px;
    flex-wrap: wrap;
}

.page-btn {
    min-width: 40px;
    height: 40px;
    padding: 0 12px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    background: #fff;
    color: #202124;
    cursor: pointer;
}

body.dark .page-btn {
    background: #303134;
    color: #e8eaed;
    border-color: #5f6368;
}

.page-btn:hover {
    background: #f1f3f4;
}

body.dark .page-btn:hover {
    background: #3c4043;
}

.page-btn.active {
    background: #1a73e8;
    color: white;
    border-color: #1a73e8;
}


/* =========================================================
   WEBSITE VIEWER
   IMPORTANT:
   This is OUTSIDE the search results layout.
========================================================= */

.site-viewer {
    display: none;
    width: calc(100% - 44px);
    margin: 0 22px 45px;
    border: 1px solid #dadce0;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 3px 15px rgba(0,0,0,.12);
}

body.dark .site-viewer {
    background: #303134;
    border-color: #5f6368;
    box-shadow: 0 3px 15px rgba(0,0,0,.35);
}

.site-viewer.show {
    display: block;
}


/* VIEWER HEADER */

.website-viewer-header {
    min-height: 62px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 1px solid #e5e5e5;
    background: #fff;
}

body.dark .website-viewer-header {
    background: #292a2d;
    border-color: #3c4043;
}

.website-viewer-info {
    min-width: 0;
    flex: 1;
}

.website-viewer-title {
    font-size: 15px;
    font-weight: 600;
    color: #202124;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

body.dark .website-viewer-title {
    color: #e8eaed;
}

.website-viewer-url {
    margin-top: 4px;
    font-size: 12px;
    color: #70757a;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

body.dark .website-viewer-url {
    color: #9aa0a6;
}

.website-viewer-actions {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
}

.website-viewer-btn {
    border: 1px solid #dadce0;
    background: #fff;
    color: #202124;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
}

.website-viewer-btn:hover {
    background: #f1f3f4;
}

body.dark .website-viewer-btn {
    background: #303134;
    color: #e8eaed;
    border-color: #5f6368;
}

body.dark .website-viewer-btn:hover {
    background: #3c4043;
}

.website-viewer-close {
    width: 38px;
    height: 38px;
    padding: 0;
    font-size: 22px;
}


/* VIEWER BODY */

.website-viewer-body {
    position: relative;
    width: 100%;
    min-height: 520px;
    background: #f8f9fa;
}

body.dark .website-viewer-body {
    background: #202124;
}


/* IFRAME */

#siteViewerFrame {
    width: 100%;
    height: 72vh;
    min-height: 520px;
    max-height: 900px;
    display: none;
    border: 0;
    background: #fff;
}


/* LOADING */

.website-viewer-loading {
    min-height: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #70757a;
    gap: 10px;
}

.viewer-loading-spinner {
    width: 38px;
    height: 38px;
    border: 3px solid #ddd;
    border-top-color: #4285f4;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}


/* FALLBACK */

.website-viewer-fallback {
    min-height: 520px;
    padding: 50px 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #5f6368;
}

body.dark .website-viewer-fallback {
    color: #bdc1c6;
}

.viewer-fallback-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f4;
    color: #5f6368;
    font-size: 30px;
    margin-bottom: 18px;
}

body.dark .viewer-fallback-icon {
    background: #303134;
    color: #bdc1c6;
}

.website-viewer-fallback h3 {
    margin: 0 0 10px;
    color: #202124;
    font-size: 20px;
}

body.dark .website-viewer-fallback h3 {
    color: #e8eaed;
}

.website-viewer-fallback p {
    max-width: 600px;
    line-height: 1.5;
    margin: 0 0 20px;
}


/* =========================================================
   IMAGE LIGHTBOX
========================================================= */

.lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0,0,0,.95);
    flex-direction: column;
}

.lightbox.show {
    display: flex;
}


/* VIEWER TOP */

.viewer-top {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    color: white;
}

.viewer-title {
    max-width: 55vw;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 14px;
}

.viewer-actions {
    display: flex;
    gap: 7px;
}

.viewer-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: white;
    cursor: pointer;
    font-size: 21px;
}

.viewer-btn:hover {
    background: rgba(255,255,255,.27);
}


/* VIEWER MAIN */

.viewer-main {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.viewer-image-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.viewer-image-wrap.zoomed {
    cursor: grab;
}

.viewer-image-wrap.dragging {
    cursor: grabbing;
}

.viewer-image {
    max-width: 88vw;
    max-height: 72vh;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
    transition: transform .12s ease;
}


/* IMAGE NAV */

.viewer-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 50px;
    height: 70px;
    border: 0;
    border-radius: 10px;
    background: rgba(0,0,0,.45);
    color: white;
    font-size: 38px;
    cursor: pointer;
    z-index: 10;
}

.viewer-nav:hover {
    background: rgba(0,0,0,.7);
}

.viewer-prev {
    left: 16px;
}

.viewer-next {
    right: 16px;
}


/* ZOOM */

.zoom-controls {
    position: absolute;
    bottom: 17px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0,0,0,.58);
    padding: 6px;
    border-radius: 25px;
    z-index: 20;
}

.zoom-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.13);
    color: white;
    cursor: pointer;
    font-size: 21px;
}

.zoom-btn:hover {
    background: rgba(255,255,255,.27);
}

.zoom-level {
    min-width: 55px;
    text-align: center;
    color: white;
    font-size: 13px;
}


/* RELATED */

.related-section {
    height: 142px;
    flex-shrink: 0;
    padding: 9px 17px 14px;
    background: rgba(0,0,0,.76);
}

.related-title {
    color: white;
    font-size: 13px;
    opacity: .82;
    margin-bottom: 7px;
}

.related-grid {
    height: 94px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
}

.related-card {
    flex: 0 0 105px;
    height: 84px;
    border-radius: 7px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
}

.related-card.active {
    border-color: #4285f4;
}

.related-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


/* =========================================================
   HOME MODE
========================================================= */

body.home-mode .top-search-area {
    display: none;
}

body.home-mode .topbar {
    position: relative;
}

body.home-mode .top-left {
    flex: 1;
}

body.home-mode .top-right {
    flex: 1;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

    .top-left {
        min-width: 170px;
    }

    .top-right {
        min-width: 170px;
    }

    .image-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


@media (max-width: 750px) {

    .topbar {
        padding: 0 10px;
    }

    .top-left {
        min-width: auto;
    }

    .top-right {
        min-width: auto;
    }

    .top-btn {
        padding: 7px;
    }

    .logo {
        font-size: 21px;
    }

    .top-search-area {
        padding: 0 8px;
    }

    .tabs {
        gap: 18px;
        overflow-x: auto;
    }

    .content {
        width: calc(100% - 30px);
        padding-left: 15px;
    }

    .image-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .image-card {
        height: 155px;
    }

    .site-viewer {
        width: calc(100% - 30px);
        margin-left: 15px;
        margin-right: 15px;
    }

    .website-viewer-header {
        align-items: flex-start;
    }

}


@media (max-width: 600px) {

    .website-viewer-header {
        flex-direction: column;
    }

    .website-viewer-actions {
        width: 100%;
    }

    .website-viewer-btn {
        flex: 1;
    }

}


@media (max-width: 500px) {

    .nav-btn {
        width: 34px;
        height: 34px;
        font-size: 18px;
    }

    .logo {
        display: none;
    }

    .top-search-area {
        padding: 0 5px;
    }

    .home {
        padding-top: 11vh;
    }

    .home-logo {
        font-size: 48px;
    }

    .viewer-image {
        max-width: 96vw;
        max-height: 65vh;
    }

    .viewer-nav {
        width: 42px;
        height: 58px;
        font-size: 30px;
    }

    .viewer-prev {
        left: 7px;
    }

    .viewer-next {
        right: 7px;
    }

    #siteViewerFrame {
        min-height: 420px;
        height: 70vh;
    }

<script>

/* =========================================================
   VARIABLES
========================================================= */

let currentQuery = "";
let currentPage = 1;
let currentTab = "all";

let currentImages = [];
let currentImageIndex = 0;

let zoomValue = 1;

let translateX = 0;
let translateY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let startTranslateX = 0;
let startTranslateY = 0;


/* WEBSITE VIEWER */

let currentWebsiteUrl = "";
let websiteViewerTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const home =
    document.getElementById("home");

const searchPage =
    document.getElementById("searchPage");

const homeSearch =
    document.getElementById("homeSearch");

const topSearchInput =
    document.getElementById("topSearchInput");

const suggestions =
    document.getElementById("suggestions");

const historyBox =
    document.getElementById("historyBox");

const historyList =
    document.getElementById("historyList");

const homeClear =
    document.getElementById("homeClear");

const topSearchClear =
    document.getElementById("topSearchClear");

const resultsBox =
    document.getElementById("results");

const imageGrid =
    document.getElementById("imageGrid");

const statusBox =
    document.getElementById("status");

const pagination =
    document.getElementById("pagination");

const lightbox =
    document.getElementById("lightbox");

const viewerImage =
    document.getElementById("viewerImage");

const viewerImageWrap =
    document.getElementById("viewerImageWrap");

const viewerTitle =
    document.getElementById("viewerTitle");

const relatedGrid =
    document.getElementById("relatedGrid");

const zoomLevel =
    document.getElementById("zoomLevel");


/* WEBSITE VIEWER ELEMENTS */

const siteViewer =
    document.getElementById("siteViewer");

const siteViewerFrame =
    document.getElementById("siteViewerFrame");

const websiteViewerTitle =
    document.getElementById("websiteViewerTitle");

const websiteViewerUrl =
    document.getElementById("websiteViewerUrl");

const websiteViewerLoading =
    document.getElementById("websiteViewerLoading");

const websiteViewerFallback =
    document.getElementById("websiteViewerFallback");

const websiteOpenButton =
    document.getElementById("websiteOpenButton");

const websiteCloseButton =
    document.getElementById("websiteCloseButton");

const websiteFallbackOpenButton =
    document.getElementById(
        "websiteFallbackOpenButton"
    );


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

    try {

        const saved =
            localStorage.getItem(
                "mysearch-history"
            );

        if (!saved) {
            return [];
        }

        const data =
            JSON.parse(saved);

        return Array.isArray(data)
            ? data
            : [];

    } catch {

        return [];

    }

}


function saveHistory(query) {

    query =
        String(query).trim();

    if (!query) {
        return;
    }

    let history =
        getHistory();

    history =
        history.filter(
            item =>
                String(item).toLowerCase() !==
                query.toLowerCase()
        );

    history.unshift(query);

    history =
        history.slice(0, 10);

    localStorage.setItem(
        "mysearch-history",
        JSON.stringify(history)
    );

    renderHistory();

}


function renderHistory() {

    const history =
        getHistory();

    historyList.innerHTML = "";

    if (!history.length) {

        historyBox.style.display =
            "none";

        return;

    }

    history.forEach(
        query => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.innerHTML = `
                <span class="history-clock">
                    🕘
                </span>

                <span class="history-text">
                    ${escapeHtml(query)}
                </span>
            `;

            item.addEventListener(
                "click",
                () => {

                    homeSearch.value =
                        query;

                    suggestions.style.display =
                        "none";

                    historyBox.style.display =
                        "none";

                    performSearch();

                }
            );

            historyList.appendChild(
                item
            );

        }
    );

}


function clearHistory() {

    localStorage.removeItem(
        "mysearch-history"
    );

    renderHistory();

}


/* =========================================================
   SUGGESTIONS
========================================================= */

function renderSuggestions() {

    const value =
        homeSearch.value
            .trim()
            .toLowerCase();

    suggestions.innerHTML = "";

    if (!value) {

        suggestions.style.display =
            "none";

        return;

    }

    const matches =
        getHistory().filter(
            item =>
                String(item)
                    .toLowerCase()
                    .includes(value)
        );

    if (!matches.length) {

        suggestions.style.display =
            "none";

        return;

    }

    matches
        .slice(0, 6)
        .forEach(
            query => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "suggestion-item";

                item.innerHTML = `
                    <span>🕘</span>

                    <span>
                        ${escapeHtml(query)}
                    </span>
                `;

                item.addEventListener(
                    "click",
                    () => {

                        homeSearch.value =
                            query;

                        suggestions.style.display =
                            "none";

                        historyBox.style.display =
                            "none";

                        performSearch();

                    }
                );

                suggestions.appendChild(
                    item
                );

            }
        );

    suggestions.style.display =
        "block";

}


/* =========================================================
   HOME INPUT
========================================================= */

homeSearch.addEventListener(
    "input",
    () => {

        homeClear.style.display =
            homeSearch.value
                ? "block"
                : "none";

        renderSuggestions();

    }
);


homeSearch.addEventListener(
    "focus",
    () => {

        if (!homeSearch.value.trim()) {

            if (getHistory().length) {

                renderHistory();

                historyBox.style.display =
                    "block";

            }

        } else {

            renderSuggestions();

        }

    }
);


homeSearch.addEventListener(
    "click",
    () => {

        if (!homeSearch.value.trim()) {

            if (getHistory().length) {

                renderHistory();

                historyBox.style.display =
                    "block";

            }

        }

    }
);


homeSearch.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            suggestions.style.display =
                "none";

            historyBox.style.display =
                "none";

            performSearch();

        }

    }
);


/* =========================================================
   TOP INPUT
========================================================= */

topSearchInput.addEventListener(
    "input",
    () => {

        topSearchClear.style.display =
            topSearchInput.value
                ? "block"
                : "none";

    }
);


topSearchInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            performSearch();

        }

    }
);


/* =========================================================
   CLEAR SEARCH
========================================================= */

function clearHomeSearch() {

    homeSearch.value = "";

    homeClear.style.display =
        "none";

    suggestions.style.display =
        "none";

    historyBox.style.display =
        "none";

    homeSearch.focus();

}


function clearTopSearch() {

    topSearchInput.value = "";

    topSearchClear.style.display =
        "none";

    topSearchInput.focus();

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

    closeWebsiteViewer();

    currentQuery = "";
    currentPage = 1;
    currentTab = "all";

    home.style.display =
        "flex";

    searchPage.style.display =
        "none";

    document.body.classList.add(
        "home-mode"
    );

    topSearchInput.value =
        "";

    topSearchClear.style.display =
        "none";

    suggestions.style.display =
        "none";

    historyBox.style.display =
        "none";

    renderHistory();

}


/* =========================================================
   SEARCH
========================================================= */

function performSearch() {

    const query =
        document.body.classList.contains(
            "home-mode"
        )
            ? homeSearch.value.trim()
            : topSearchInput.value.trim();

    if (!query) {
        return;
    }

    closeWebsiteViewer();

    currentQuery =
        query;

    currentPage =
        1;

    currentTab =
        "all";

    saveHistory(query);

    home.style.display =
        "none";

    searchPage.style.display =
        "block";

    document.body.classList.remove(
        "home-mode"
    );

    topSearchInput.value =
        query;

    topSearchClear.style.display =
        "block";

    activateTab("all");

    search(1);

}


/* =========================================================
   WEB SEARCH
========================================================= */

async function search(page = 1) {

    currentPage =
        page;

    closeWebsiteViewer();

    resultsBox.style.display =
        "block";

    imageGrid.style.display =
        "none";

    pagination.innerHTML =
        "";

    resultsBox.innerHTML = `
        <div class="loading">

            <div class="spinner"></div>

            Searching...

        </div>
    `;

    statusBox.textContent =
        `Searching for "${currentQuery}"...`;

    try {

        const response =
            await fetch(
                "/api/search?q=" +
                encodeURIComponent(
                    currentQuery
                ) +
                "&page=" +
                page
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Search failed"
            );

        }

        const results =
            Array.isArray(
                data.results
            )
                ? data.results
                : [];

        if (!results.length) {

            resultsBox.innerHTML = `
                <div class="message">
                    No results found.
                </div>
            `;

            statusBox.textContent =
                `No results for "${currentQuery}"`;

            return;

        }

        statusBox.textContent =
            `Search results for "${currentQuery}"`;

        resultsBox.innerHTML =
            "";

        results.forEach(
            result => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "result";

                const titleText =
                    String(
                        result.title ||
                        "Untitled"
                    );

                const link =
                    normalizeUrl(
                        result.link ||
                        result.url ||
                        ""
                    );

                const description =
                    String(
                        result.description ||
                        ""
                    );

                item.innerHTML = `

                    <div
                        class="result-title"
                        role="button"
                        tabindex="0"
                    >
                        ${escapeHtml(titleText)}
                    </div>

                    <div class="result-url">
                        ${escapeHtml(
                            link ||
                            String(
                                result.link ||
                                result.url ||
                                ""
                            )
                        )}
                    </div>

                    <div class="result-description">
                        ${escapeHtml(
                            description
                        )}
                    </div>

                `;


                const titleElement =
                    item.querySelector(
                        ".result-title"
                    );


                if (link) {

                    titleElement.addEventListener(
                        "click",
                        () => {

                            openWebsiteViewer(
                                link,
                                titleText
                            );

                        }
                    );


                    titleElement.addEventListener(
                        "keydown",
                        event => {

                            if (
                                event.key ===
                                "Enter"
                            ) {

                                openWebsiteViewer(
                                    link,
                                    titleText
                                );

                            }

                        }
                    );

                } else {

                    titleElement.style.cursor =
                        "default";

                }


                resultsBox.appendChild(
                    item
                );

            }
        );


        createPagination(
            page,
            Boolean(
                data.hasMore
            ),
            search,
            Number(
                data.totalPages ||
                0
            )
        );

    } catch (error) {

        console.error(error);

        resultsBox.innerHTML = `

            <div class="message error">

                Search failed.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        statusBox.textContent =
            "Search error.";

    }

}


/* =========================================================
   IMAGE SEARCH
========================================================= */

function performImageSearch() {

    const query =
        document.body.classList.contains(
            "home-mode"
        )
            ? homeSearch.value.trim()
            : topSearchInput.value.trim();

    if (!query) {
        return;
    }

    closeWebsiteViewer();

    currentQuery =
        query;

    currentPage =
        1;

    currentTab =
        "images";

    saveHistory(query);

    home.style.display =
        "none";

    searchPage.style.display =
        "block";

    document.body.classList.remove(
        "home-mode"
    );

    topSearchInput.value =
        query;

    topSearchClear.style.display =
        "block";

    activateTab("images");

    showImages(1);

}


/* =========================================================
   TABS
========================================================= */

function showTab(tab) {

    currentTab =
        tab;

    closeWebsiteViewer();

    activateTab(tab);

    if (tab === "all") {

        search(1);

        return;

    }


    if (tab === "images") {

        showImages(1);

        return;

    }


    if (tab === "news") {

        showComingSoon(
            "News search"
        );

        return;

    }


    if (tab === "videos") {

        showComingSoon(
            "Video search"
        );

        return;

    }

}


function activateTab(tab) {

    document
        .querySelectorAll(".tab")
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );


    const ids = {

        all:
            "tabAll",

        images:
            "tabImages",

        news:
            "tabNews",

        videos:
            "tabVideos"

    };


    const selected =
        document.getElementById(
            ids[tab]
        );


    if (selected) {

        selected.classList.add(
            "active"
        );

    }

}


/* =========================================================
   IMAGE SEARCH
========================================================= */

async function showImages(page = 1) {

    currentPage =
        page;

    closeWebsiteViewer();

    resultsBox.style.display =
        "none";

    imageGrid.style.display =
        "grid";

    pagination.innerHTML =
        "";

    imageGrid.innerHTML = `

        <div
            class="loading"
            style="grid-column:1/-1;"
        >

            <div class="spinner"></div>

            Loading images...

        </div>

    `;

    statusBox.textContent =
        `Images for "${currentQuery}"`;


    try {

        const response =
            await fetch(
                "/api/images?q=" +
                encodeURIComponent(
                    currentQuery
                ) +
                "&page=" +
                page
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Image search failed"
            );

        }


        const images =
            Array.isArray(
                data.images
            )
                ? data.images
                : [];


        currentImages =
            images;


        if (!images.length) {

            imageGrid.innerHTML = `

                <div
                    class="message"
                    style="grid-column:1/-1;"
                >

                    No images found.

                </div>

            `;

            return;

        }


        imageGrid.innerHTML =
            "";


        images.forEach(
            (item, index) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "image-card";


                const img =
                    document.createElement(
                        "img"
                    );


                img.src =
                    item.image;

                img.alt =
                    "Search image";

                img.loading =
                    "lazy";


                card.addEventListener(
                    "click",
                    () => {

                        openLightbox(
                            index
                        );

                    }
                );


                img.addEventListener(
                    "error",
                    () => {

                        card.style.display =
                            "none";

                    }
                );


                card.appendChild(
                    img
                );

                imageGrid.appendChild(
                    card
                );

            }
        );


        createPagination(
            page,
            Boolean(
                data.hasMore
            ),
            showImages
        );


    } catch (error) {

        console.error(error);


        imageGrid.innerHTML = `

            <div
                class="message error"
                style="grid-column:1/-1;"
            >

                Image search failed.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================================
   WEBSITE VIEWER
========================================================= */


/*
    Only HTTP/HTTPS URLs are accepted.
*/

function normalizeUrl(rawUrl) {

    try {

        const value =
            String(rawUrl || "").trim();

        if (!value) {
            return null;
        }

        const url =
            new URL(
                value,
                window.location.href
            );

        if (
            url.protocol !== "http:" &&
            url.protocol !== "https:"
        ) {

            return null;

        }

        return url.href;

    } catch {

        return null;

    }

}


/*
    Some large sites commonly block iframe embedding.
    For these, don't show a large blank iframe.
*/

function isKnownIframeBlockedHost(url) {

    try {

        const host =
            new URL(url)
                .hostname
                .toLowerCase();

        const blockedHosts = [

            "google.com",
            "www.google.com",

            "facebook.com",
            "www.facebook.com",

            "instagram.com",
            "www.instagram.com",

            "twitter.com",
            "www.twitter.com",

            "x.com",
            "www.x.com",

            "linkedin.com",
            "www.linkedin.com"

        ];


        return blockedHosts.some(
            blocked =>

                host === blocked ||
                host.endsWith(
                    "." + blocked
                )
        );

    } catch {

        return false;

    }

}


/*
    Show Website Viewer.
*/

function openWebsiteViewer(
    rawUrl,
    title = "Website"
) {

    const url =
        normalizeUrl(
            rawUrl
        );


    if (!url) {

        return;

    }


    clearTimeout(
        websiteViewerTimer
    );


    currentWebsiteUrl =
        url;


    websiteViewerTitle.textContent =
        title ||
        "Website Viewer";


    websiteViewerUrl.textContent =
        url;


    siteViewer.classList.add(
        "show"
    );


    siteViewer.setAttribute(
        "aria-hidden",
        "false"
    );


    websiteViewerFallback.style.display =
        "none";


    websiteViewerLoading.style.display =
        "flex";


    siteViewerFrame.style.display =
        "none";


    siteViewerFrame.src =
        "about:blank";


    /*
        If this host is known to reject iframe
        embedding, immediately show fallback.
    */

    if (
        isKnownIframeBlockedHost(
            url
        )
    ) {

        showWebsiteFallback();

        scrollToWebsiteViewer();

        return;

    }


    /*
        Give the iframe a chance to load.
    */

    websiteViewerTimer =
        setTimeout(
            () => {

                if (
                    currentWebsiteUrl ===
                    url
                ) {

                    showWebsiteFallback();

                }

            },
            7000
        );


    requestAnimationFrame(
        () => {

            siteViewerFrame.style.display =
                "block";

            siteViewerFrame.src =
                url;

            scrollToWebsiteViewer();

        }
    );

}


/*
    IMPORTANT:
    Browsers do not provide a reliable iframe error
    event for cross-origin blocked pages.

    Therefore we use:
    - known blocked domains
    - timeout fallback
*/

siteViewerFrame.addEventListener(
    "load",
    () => {

        /*
            Do NOT assume that load means the site
            successfully rendered. Browsers can fire
            iframe load even when embedded content is
            blocked.
        */

        websiteViewerLoading.style.display =
            "none";

    }
);


function showWebsiteFallback() {

    clearTimeout(
        websiteViewerTimer
    );


    websiteViewerLoading.style.display =
        "none";


    siteViewerFrame.style.display =
        "none";


    websiteViewerFallback.style.display =
        "flex";

}


/*
    Scroll viewer into screen.
*/

function scrollToWebsiteViewer() {

    setTimeout(
        () => {

            siteViewer.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        },
        50
    );

}


/*
    Open current website in new tab.
*/

function openWebsiteInNewTab() {

    if (!currentWebsiteUrl) {
        return;
    }

    window.open(
        currentWebsiteUrl,
        "_blank",
        "noopener,noreferrer"
    );

}


/*
    Close Website Viewer.
*/

function closeWebsiteViewer() {

    clearTimeout(
        websiteViewerTimer
    );


    currentWebsiteUrl =
        "";


    siteViewer.classList.remove(
        "show"
    );


    siteViewer.setAttribute(
        "aria-hidden",
        "true"
    );


    websiteViewerLoading.style.display =
        "none";


    websiteViewerFallback.style.display =
        "none";


    siteViewerFrame.style.display =
        "none";


    siteViewerFrame.src =
        "about:blank";

}


/* BUTTONS */

websiteOpenButton.addEventListener(
    "click",
    openWebsiteInNewTab
);


websiteFallbackOpenButton.addEventListener(
    "click",
    openWebsiteInNewTab
);


websiteCloseButton.addEventListener(
    "click",
    closeWebsiteViewer
);


/* ESC CLOSE WEBSITE VIEWER */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            siteViewer.classList.contains(
                "show"
            )
        ) {

            closeWebsiteViewer();

        }

    }
);


/* =========================================================
   IMAGE LIGHTBOX
========================================================= */

function openLightbox(index) {

    if (
        !currentImages.length
    ) {

        return;

    }


    currentImageIndex =
        Math.max(
            0,
            Math.min(
                index,
                currentImages.length - 1
            )
        );


    lightbox.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    renderViewerImage();

    renderRelatedImages();

    resetZoom();

}


function closeLightbox() {

    lightbox.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";


    viewerImage.removeAttribute(
        "src"
    );

}


/* =========================================================
   VIEWER IMAGE
========================================================= */

function renderViewerImage() {

    const item =
        currentImages[
            currentImageIndex
        ];


    if (!item) {
        return;
    }


    viewerImage.src =
        item.image;


    viewerTitle.textContent =
        `Image ${
            currentImageIndex + 1
        } of ${
            currentImages.length
        }`;


    resetZoom();

    updateRelatedActive();

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextImage() {

    if (
        !currentImages.length
    ) {

        return;

    }


    currentImageIndex++;


    if (
        currentImageIndex >=
        currentImages.length
    ) {

        currentImageIndex =
            0;

    }


    renderViewerImage();

    renderRelatedImages();

}


function previousImage() {

    if (
        !currentImages.length
    ) {

        return;

    }


    currentImageIndex--;


    if (
        currentImageIndex < 0
    ) {

        currentImageIndex =
            currentImages.length - 1;

    }


    renderViewerImage();

    renderRelatedImages();

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn() {

    zoomValue += .25;


    if (
        zoomValue > 5
    ) {

        zoomValue = 5;

    }


    applyTransform();

}


function zoomOut() {

    zoomValue -= .25;


    if (
        zoomValue < .5
    ) {

        zoomValue = .5;

    }


    if (
        zoomValue <= 1
    ) {

        translateX = 0;

        translateY = 0;

    }


    applyTransform();

}


function resetZoom() {

    zoomValue = 1;

    translateX = 0;

    translateY = 0;

    applyTransform();

}


function applyTransform() {

    viewerImage.style.transform =
        `translate(
            ${translateX}px,
            ${translateY}px
        ) scale(${zoomValue})`;


    zoomLevel.textContent =
        Math.round(
            zoomValue * 100
        ) + "%";


    viewerImageWrap.classList.toggle(
        "zoomed",
        zoomValue > 1
    );

}


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

viewerImageWrap.addEventListener(
    "wheel",
    event => {

        if (
            !lightbox.classList.contains(
                "show"
            )
        ) {

            return;

        }


        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoomIn();

        } else {

            zoomOut();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   DRAG IMAGE
========================================================= */

viewerImageWrap.addEventListener(
    "mousedown",
    event => {

        if (
            zoomValue <= 1
        ) {

            return;

        }


        dragging = true;


        viewerImageWrap.classList.add(
            "dragging"
        );


        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;


        startTranslateX =
            translateX;

        startTranslateY =
            translateY;

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (!dragging) {
            return;
        }


        translateX =
            startTranslateX +
            event.clientX -
            dragStartX;


        translateY =
            startTranslateY +
            event.clientY -
            dragStartY;


        applyTransform();

    }
);


window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

        viewerImageWrap.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   RELATED IMAGES
========================================================= */

function renderRelatedImages() {

    relatedGrid.innerHTML =
        "";


    currentImages.forEach(
        (item, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "related-card";


            if (
                index ===
                currentImageIndex
            ) {

                card.classList.add(
                    "active"
                );

            }


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                item.image;


            img.alt =
                "Related image";


            img.addEventListener(
                "error",
                () => {

                    card.style.display =
                        "none";

                }
            );


            card.appendChild(
                img
            );


            card.addEventListener(
                "click",
                () => {

                    currentImageIndex =
                        index;

                    renderViewerImage();

                    renderRelatedImages();

                }
            );


            relatedGrid.appendChild(
                card
            );

        }
    );

}


function updateRelatedActive() {

    const cards =
        relatedGrid.querySelectorAll(
            ".related-card"
        );


    cards.forEach(
        (card, index) => {

            card.classList.toggle(
                "active",
                index ===
                currentImageIndex
            );

        }
    );

}


/* =========================================================
   PAGINATION
========================================================= */

function createPagination(
    page,
    hasMore,
    callback,
    totalPages = 0
) {

    pagination.innerHTML =
        "";


    if (
        page > 1
    ) {

        pagination.appendChild(
            createPageButton(
                "‹ Previous",
                () => {

                    callback(
                        page - 1
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            )
        );

    }


    let start =
        Math.max(
            1,
            page - 3
        );


    let end =
        page + 3;


    if (
        totalPages > 0
    ) {

        end =
            Math.min(
                end,
                totalPages
            );

    }


    if (
        start > 1
    ) {

        pagination.appendChild(
            createPageButton(
                "1",
                () => callback(1),
                page === 1
            )
        );


        if (
            start > 2
        ) {

            const dots =
                document.createElement(
                    "span"
                );

            dots.textContent =
                "...";

            pagination.appendChild(
                dots
            );

        }

    }


    for (
        let i = start;
        i <= end;
        i++
    ) {

        pagination.appendChild(
            createPageButton(
                String(i),
                () => {

                    callback(i);

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                },
                i === page
            )
        );

    }


    if (
        hasMore
    ) {

        pagination.appendChild(
            createPageButton(
                "Next ›",
                () => {

                    callback(
                        page + 1
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }
            )
        );

    }

}


function createPageButton(
    text,
    callback,
    active = false
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "page-btn";


    button.textContent =
        text;


    if (active) {

        button.classList.add(
            "active"
        );

    }


    button.addEventListener(
        "click",
        callback
    );


    return button;

}


/* =========================================================
   BACK BUTTON
========================================================= */

function goBack() {

    if (
        lightbox.classList.contains(
            "show"
        )
    ) {

        closeLightbox();

        return;

    }


    if (
        siteViewer.classList.contains(
            "show"
        )
    ) {

        closeWebsiteViewer();

        return;

    }


    if (
        !document.body.classList.contains(
            "home-mode"
        )
    ) {

        goHome();

        return;

    }


    if (
        window.history.length > 1
    ) {

        window.history.back();

    }

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

    window.location.reload();

}


/* =========================================================
   COMING SOON
========================================================= */

function showComingSoon(name) {

    closeWebsiteViewer();


    resultsBox.style.display =
        "block";


    imageGrid.style.display =
        "none";


    pagination.innerHTML =
        "";


    statusBox.textContent =
        name;


    resultsBox.innerHTML = `

        <div class="message">

            🚧 ${escapeHtml(name)}
            is not connected yet.

        </div>

    `;

}


/* =========================================================
   DARK MODE
========================================================= */

function updateDarkModeButton() {

    const button =
        document.getElementById(
            "darkModeButton"
        );


    if (
        document.body.classList.contains(
            "dark"
        )
    ) {

        button.textContent =
            "☀️";

        button.title =
            "Light mode";

    } else {

        button.textContent =
            "🌙";

        button.title =
            "Dark mode";

    }

}


function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    localStorage.setItem(
        "mysearch-dark",
        document.body.classList.contains(
            "dark"
        )
            ? "1"
            : "0"
    );


    updateDarkModeButton();

}


if (
    localStorage.getItem(
        "mysearch-dark"
    ) === "1"
) {

    document.body.classList.add(
        "dark"
    );

}


updateDarkModeButton();


/* =========================================================
   ABOUT
========================================================= */

function showAbout() {

    alert(
        "MySearch\n\n" +
        "A local web search engine."
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

renderHistory();

</script>
